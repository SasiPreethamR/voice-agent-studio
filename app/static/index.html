<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Voice Agent Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◉</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;450;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090b;--bg1:#111113;--bg2:#18181b;--bg3:#1f1f23;
  --border:rgba(255,255,255,.06);--border-h:rgba(255,255,255,.1);
  --surface:rgba(255,255,255,.03);--surface-h:rgba(255,255,255,.055);
  --text:#fafafa;--text2:#a1a1aa;--text3:#71717a;--text4:#52525b;
  --accent:#e4e4e7;--accent2:#a1a1aa;
  --green:#22c55e;--red:#ef4444;--blue:#3b82f6;--amber:#eab308;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --r:12px;--rs:8px;
  --agent-c1:161,161,170;--agent-c2:113,113,122;
  --agent-hex1:#a1a1aa;--agent-hex2:#71717a;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);
  overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:'cv02','cv03','cv04','cv11'}

/* ── NAV ─────────────────────────────────────────────────── */
nav{display:flex;align-items:center;height:52px;padding:0 24px;border-bottom:1px solid var(--border);
  background:var(--bg);position:relative;z-index:20;flex-shrink:0}
.nav-brand{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-.02em;margin-right:32px;
  display:flex;align-items:center;gap:8px}
.nav-brand .mark{width:7px;height:7px;border-radius:50%;background:var(--text3);display:inline-block}
.nav-tabs{display:flex;gap:2px;height:100%}
.nav-tab{display:flex;align-items:center;gap:6px;padding:0 16px;height:100%;background:none;border:none;
  color:var(--text3);font-family:var(--font);font-size:13px;font-weight:450;cursor:pointer;
  border-bottom:2px solid transparent;transition:color .15s}
.nav-tab:hover{color:var(--text2)}
.nav-tab.active{color:var(--text);border-bottom-color:var(--text)}
.nav-tab svg{width:16px;height:16px;opacity:.5}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.svc-row{display:flex;gap:6px;align-items:center}
.svc-dot{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text3);font-weight:450}
.svc-dot .d{width:6px;height:6px;border-radius:50%;background:var(--text4)}
.svc-dot .d.on{background:var(--green)}.svc-dot .d.off{background:var(--red)}
.ws-stat{font-size:11px;color:var(--text4);display:flex;align-items:center;gap:5px}
.ws-stat .wd{width:6px;height:6px;border-radius:50%;background:var(--text4)}
.ws-stat .wd.online{background:var(--green)}
.tour-launch{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text2);
  font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;transition:.15s}
.tour-launch:hover{background:rgba(255,255,255,.08);border-color:var(--border-h);color:var(--text)}
.tour-launch svg{width:14px;height:14px;opacity:.75}

/* ── VIEWS ───────────────────────────────────────────────── */
.view{display:none;flex:1;overflow:hidden}.view.active{display:flex}
.app{display:flex;flex-direction:column;height:100vh}

/* ── SANDBOX VIEW ────────────────────────────────────────── */
.sandbox{display:flex;flex:1;overflow:hidden}
.sb-sidebar{width:280px;border-right:1px solid var(--border);display:flex;flex-direction:column;
  background:var(--bg1);flex-shrink:0;overflow:hidden}
.sb-agent-info{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:0}
.sai-empty{color:var(--text4);font-size:12px;text-align:center;padding:40px 16px;line-height:1.6}
.sai-hdr{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.sai-vibe{width:36px;height:36px;border-radius:50%;flex-shrink:0}
.sai-name{font-size:14px;font-weight:550;color:var(--text1);line-height:1.3}
.sai-meta{font-size:11px;color:var(--text4);margin-top:2px}
.sai-section{margin-bottom:16px}
.sai-label{font-size:10px;font-weight:550;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text4);margin-bottom:8px}
.sai-instructions{font-size:12px;color:var(--text3);line-height:1.6;white-space:pre-wrap;
  max-height:200px;overflow-y:auto;word-break:break-word}
.sai-instructions:empty::after{content:'No instructions configured';color:var(--text4);font-style:italic}
.sai-tool-list{display:flex;flex-direction:column;gap:6px}
.sai-tool{padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.05)}
.sai-tool-name{font-size:12px;font-weight:500;color:var(--text2);display:flex;align-items:center;gap:6px}
.sai-tool-name .api-type{font-size:9px}
.sai-tool-desc{font-size:11px;color:var(--text4);margin-top:3px;line-height:1.4}
.sai-tool-params{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.sai-tool-param{font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.04);
  color:var(--text4);border:1px solid rgba(255,255,255,.04)}
.sai-settings{display:flex;flex-wrap:wrap;gap:8px}
.sai-setting{padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.05);font-size:11px;color:var(--text3)}
.sai-setting b{color:var(--text2);font-weight:500;margin-right:4px}
.sai-edit-btn{width:100%;padding:8px;border-radius:8px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);color:var(--text3);font-size:12px;font-weight:450;
  cursor:pointer;font-family:var(--font);transition:.15s;margin-top:auto}
.sai-edit-btn:hover{background:rgba(255,255,255,.08);color:var(--text1)}
.sb-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative}
.sb-agent-bg{position:absolute;inset:0;opacity:0;transition:opacity 1.5s ease;overflow:hidden}
.sb-agent-bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;padding:16px;z-index:2}
.agent-pill-wrap{position:relative}
.agent-pill{display:flex;align-items:center;gap:8px;padding:6px 16px;border-radius:40px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);backdrop-filter:blur(12px);
  font-size:12px;color:var(--text2);font-weight:450;transition:all .3s;cursor:pointer;user-select:none}
.agent-pill:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
.agent-pill .ap-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:background .3s}
.agent-pill .ap-name{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-pill .ap-chev{width:10px;height:10px;opacity:.4;transition:transform .2s,opacity .2s}
.agent-pill-wrap.open .ap-chev{opacity:.7;transform:rotate(180deg)}
/* Agent dropdown */
.agent-dd{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);
  width:320px;max-height:0;overflow:hidden;opacity:0;pointer-events:none;
  background:rgba(20,20,22,.96);border:1px solid rgba(255,255,255,.07);border-radius:12px;
  backdrop-filter:blur(32px);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03) inset;
  transition:max-height .3s cubic-bezier(.4,0,.2,1),opacity .2s;z-index:200}
.agent-dd.open{max-height:360px;opacity:1;pointer-events:auto}
.agent-dd-search{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.05)}
.agent-dd-search svg{width:14px;height:14px;color:var(--text4);flex-shrink:0}
.agent-dd-search input{flex:1;background:none;border:none;outline:none;color:var(--text1);
  font-family:var(--font);font-size:12px;letter-spacing:.01em}
.agent-dd-search input::placeholder{color:var(--text4)}
.agent-dd-list{overflow-y:auto;max-height:300px;padding:4px}
.agent-dd-list::-webkit-scrollbar{width:4px}
.agent-dd-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:4px}
.ad-item{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;
  cursor:pointer;transition:background .15s;position:relative}
.ad-item:hover{background:rgba(255,255,255,.05)}
.ad-item.active{background:rgba(255,255,255,.04)}
.ad-aura{width:32px;height:32px;border-radius:50%;flex-shrink:0;position:relative}
.ad-aura canvas{width:32px;height:32px;border-radius:50%}
.ad-item.active .ad-aura{box-shadow:0 0 0 1.5px rgba(255,255,255,.2)}
.ad-info{flex:1;min-width:0}
.ad-name{font-size:12px;font-weight:500;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-desc{font-size:10px;color:var(--text4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ad-check{width:14px;height:14px;color:var(--text3);opacity:0;flex-shrink:0}
.ad-item.active .ad-check{opacity:1}
/* Agent tooltip (portal, positioned by JS) */
#agentTooltip{position:fixed;width:260px;padding:14px 16px;background:rgba(20,20,22,.98);border:1px solid rgba(255,255,255,.08);
  border-radius:10px;backdrop-filter:blur(24px);box-shadow:0 12px 40px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;
  transform:translateX(-4px);z-index:9999}
#agentTooltip.show{opacity:1;transform:translateX(0);pointer-events:auto}
.adt-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.06)}
.adt-dot{width:6px;height:6px;border-radius:50%}
.adt-title{font-size:12px;font-weight:600;color:var(--text1)}
.adt-section{margin-bottom:8px}
.adt-label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text4);margin-bottom:3px;font-weight:500}
.adt-val{font-size:11px;color:var(--text2);line-height:1.5}
.adt-val.mono{font-family:'SF Mono',Monaco,Consolas,monospace;font-size:10px;color:var(--text3);
  background:rgba(255,255,255,.03);padding:4px 6px;border-radius:4px;max-height:52px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.adt-tags{display:flex;flex-wrap:wrap;gap:4px}
.adt-tag{font-size:9px;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.05);color:var(--text3);font-weight:450}
.adt-row{display:flex;gap:12px}
.adt-row .adt-section{flex:1}
.orb-wrap{position:relative;width:300px;height:300px;margin-bottom:28px;z-index:1;overflow:visible}
#orbCanvas{position:absolute;top:50%;left:50%;width:760px;height:760px;transform:translate(-50%,-50%);pointer-events:none}
.sb-label{font-size:13px;color:var(--text3);font-weight:400;margin-bottom:32px;min-height:18px;z-index:1;letter-spacing:.01em}
.sb-ctrls{display:flex;gap:12px;z-index:1}
.sb-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 28px;border:none;border-radius:40px;
  font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.sb-btn-start{background:var(--text);color:var(--bg);box-shadow:0 2px 20px rgba(255,255,255,.08)}
.sb-btn-start:hover{box-shadow:0 4px 30px rgba(255,255,255,.15);transform:translateY(-1px)}
.sb-btn-start:disabled{opacity:.3;pointer-events:none}
.sb-btn-end{background:transparent;color:var(--text3);border:1px solid var(--border)}
.sb-btn-end:hover{border-color:var(--border-h);color:var(--text2)}.sb-btn-end:disabled{opacity:.25;pointer-events:none}
.partial-bar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:12px;
  color:var(--text4);font-style:italic;z-index:1;max-width:70%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-transcript{width:380px;border-left:1px solid var(--border);display:flex;flex-direction:column;
  background:var(--bg1);flex-shrink:0}
.sb-trans-hdr{padding:14px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:500;color:var(--text2)}
.transcript{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}

/* messages */
.msg{max-width:85%;padding:10px 14px;border-radius:var(--r);font-size:13px;line-height:1.6;
  animation:msgIn .3s cubic-bezier(.4,0,.2,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;background:rgba(255,255,255,.06);border:1px solid var(--border)}
.msg.bot{align-self:flex-start;background:transparent;border:1px solid var(--border)}
.msg.system{align-self:center;background:var(--surface);border:1px solid var(--border);
  font-size:11px;color:var(--text3);text-align:center;max-width:90%;border-radius:20px;padding:6px 14px}
.msg .ts{font-size:10px;color:var(--text4);margin-top:4px}
.msg.tool-call{background:rgba(255,255,255,.02);border:1px solid var(--border)}
.msg.tool-result{background:rgba(255,255,255,.02);border:1px solid var(--border)}
.msg pre{margin:0;white-space:pre-wrap;font-size:11px;color:var(--text3);max-height:120px;overflow-y:auto;font-family:'SF Mono','Fira Code',monospace}

/* ── AGENTS VIEW ─────────────────────────────────────────── */
.agents-view{flex-direction:column;overflow-y:auto;padding:32px 40px}
.agents-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.agents-top h2{font-size:20px;font-weight:600;letter-spacing:-.02em}
.agents-top p{font-size:13px;color:var(--text3);margin-top:4px}
.btn-create{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:var(--rs);
  background:var(--text);color:var(--bg);font-family:var(--font);font-size:13px;font-weight:500;
  border:none;cursor:pointer;transition:.15s}
.btn-create:hover{opacity:.9}
.agents-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.ag-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);
  padding:0;cursor:pointer;transition:all .2s;overflow:hidden;position:relative}
.ag-card:hover{border-color:var(--border-h);box-shadow:0 4px 24px rgba(0,0,0,.3)}
.ag-card.active{border-color:rgba(255,255,255,.15)}
.ag-vibe{height:3px;width:100%;transition:background .3s}
.ag-body{padding:18px 20px 16px}
.ag-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.ag-name{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.ag-active-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(34,197,94,.4)}
.ag-actions{display:flex;gap:2px}
.ag-btn{background:none;border:none;color:var(--text4);cursor:pointer;padding:4px 6px;border-radius:4px;
  font-size:13px;transition:.15s}
.ag-btn:hover{color:var(--text2);background:var(--surface)}
.ag-desc{font-size:12px;color:var(--text3);line-height:1.5;margin-bottom:12px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ag-tags{display:flex;flex-wrap:wrap;gap:4px}
.ag-tag{font-size:10px;padding:3px 8px;border-radius:4px;background:var(--surface);
  color:var(--text3);border:1px solid var(--border);font-weight:450}

/* Agents sub-tabs */
.agents-view{display:flex;flex-direction:column;flex:1;overflow:hidden;padding:32px 40px 0}
.agents-subtabs{display:flex;gap:0;border-bottom:1px solid var(--border);flex-shrink:0}
.agents-subtab{padding:10px 20px;background:none;border:none;color:var(--text3);font-family:var(--font);
  font-size:13px;font-weight:450;cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.agents-subtab:hover{color:var(--text2)}
.agents-subtab.active{color:var(--text);border-bottom-color:var(--text)}
.agents-panel{display:none;flex:1;overflow-y:auto;padding:24px 0 32px}
.agents-panel.active{display:block}
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.av-api-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;transition:.2s}
.av-api-card:hover{border-color:var(--border-h);box-shadow:0 4px 20px rgba(0,0,0,.25)}
.av-api-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.av-api-name{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.av-api-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.av-api-card:hover .av-api-actions{opacity:1}
.av-api-desc{font-size:12px;color:var(--text3);line-height:1.5;margin-bottom:10px}
.av-api-tags{display:flex;flex-wrap:wrap;gap:4px}
.av-api-tag{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--surface);color:var(--text4);border:1px solid var(--border)}
.av-doc-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;
  display:flex;align-items:center;gap:12px;transition:.15s}
.av-doc-card:hover{border-color:var(--border-h)}
.av-doc-icon{font-size:24px;opacity:.5}
.av-doc-info{flex:1;min-width:0}
.av-doc-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av-doc-meta{font-size:11px;color:var(--text4);margin-top:2px}
.doc-kquest{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:999px;
  padding:1px 7px;margin-left:6px;color:var(--text3);background:var(--surface);font-size:10px;white-space:nowrap}
.doc-kquest.done{color:var(--green);border-color:rgba(34,197,94,.22);background:rgba(34,197,94,.06)}
.doc-kquest.generating{color:var(--amber);border-color:rgba(245,158,11,.24);background:rgba(245,158,11,.06)}
.av-doc-actions{display:flex;align-items:center;gap:4px}
.av-doc-del{background:none;border:none;color:var(--text4);cursor:pointer;font-size:13px;padding:6px;border-radius:4px;
  opacity:0;transition:.15s}
.av-doc-card:hover .av-doc-del{opacity:1}
.av-doc-del:hover{color:var(--red);background:rgba(239,68,68,.06)}
.doc-browser-head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 4px}
.doc-crumbs{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.doc-crumb{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);color:var(--text3);
  font-family:var(--font);font-size:11px;padding:5px 9px;cursor:pointer;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-crumb:hover{color:var(--text);border-color:var(--border-h)}
.doc-crumb.current{color:var(--text);background:var(--bg2);cursor:default}
.doc-browser-right{display:flex;align-items:center;gap:8px;white-space:nowrap}
.doc-browser-summary{font-size:11px;color:var(--text4);white-space:nowrap}
.doc-browser-action{height:28px;padding:0 10px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);
  color:var(--text3);font-family:var(--font);font-size:11px;cursor:pointer}
.doc-browser-action:hover{color:var(--red);border-color:rgba(239,68,68,.25);background:rgba(239,68,68,.06)}
.av-folder-card{cursor:pointer}
.av-folder-card .av-doc-icon{opacity:.75}
.av-upload{border:1.5px dashed var(--border);border-radius:var(--r);padding:32px;text-align:center;
  cursor:pointer;transition:.2s;margin-bottom:16px}
.av-upload:hover,.av-upload.drag{border-color:var(--text3);background:var(--surface)}
.av-upload .uz-icon{font-size:28px;margin-bottom:8px;opacity:.3}
.av-upload p{font-size:12px;color:var(--text4)}
.upload-actions{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.upload-actions button{height:30px;padding:0 12px;border-radius:var(--rs);border:1px solid var(--border);
  background:var(--surface);color:var(--text2);font-family:var(--font);font-size:12px;cursor:pointer}
.upload-actions button:hover{background:var(--surface-h);color:var(--text)}
.ingest-status{font-size:11px;color:var(--text4);margin-top:10px;min-height:14px}
/* ── Upload Queue ──────────────────────────────────────── */
.upload-queue{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.uq-item{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:var(--rs);
  border:1px solid var(--border);background:var(--bg);font-size:11px;flex-wrap:nowrap;min-width:0}
.uq-item.uq-run{border-color:rgba(59,130,246,.25);background:rgba(59,130,246,.04)}
.uq-item.uq-ok{border-color:rgba(34,197,94,.2);background:rgba(34,197,94,.04)}
.uq-item.uq-warn{border-color:rgba(245,158,11,.25);background:rgba(245,158,11,.04)}
.uq-item.uq-err{border-color:rgba(239,68,68,.2);background:rgba(239,68,68,.04)}
.uq-item.uq-wait{opacity:.6}
.uq-icon{font-size:12px;flex-shrink:0;width:14px;text-align:center}
.uq-item.uq-run .uq-icon{display:inline-block;animation:uqspin .9s linear infinite}
@keyframes uqspin{to{transform:rotate(360deg)}}
.uq-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2);font-weight:450}
.uq-count{flex-shrink:0;color:var(--text4);font-size:10px}
.uq-bar{flex:0 0 64px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.uq-bar-fill{height:100%;background:var(--blue);border-radius:2px;transition:width .4s}
.uq-pct{flex-shrink:0;color:var(--text4);font-size:10px;min-width:28px;text-align:right}
.uq-errtxt{flex:1;min-width:0;color:var(--red);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uq-retry-btn{flex-shrink:0;background:none;border:1px solid var(--border);border-radius:4px;
  color:var(--text3);cursor:pointer;font-size:11px;padding:2px 6px;font-family:var(--font);transition:.15s}
.uq-retry-btn:hover{color:var(--text);border-color:var(--border-h)}
/* Retry K-Quest on folder cards */
.av-doc-retry{background:none;border:1px solid var(--border);border-radius:var(--rs);
  color:var(--text4);cursor:pointer;font-size:10px;padding:3px 7px;font-family:var(--font);
  transition:.15s;white-space:nowrap;opacity:0;margin-right:2px;line-height:1.4}
.av-doc-card:hover .av-doc-retry{opacity:1}
.av-doc-retry:hover{color:var(--text);border-color:var(--text3);background:var(--surface)}
.doc-scope-picker{display:flex;flex-direction:column;gap:8px;border:1px solid var(--border);border-radius:var(--rs);background:var(--bg);padding:8px}
.doc-scope-top{display:flex;align-items:center;gap:8px}
.doc-scope-search{flex:1;height:34px;border:1px solid var(--border);border-radius:var(--rs);background:var(--bg1);
  color:var(--text);font-family:var(--font);font-size:12px;padding:0 10px;outline:none}
.doc-scope-search:focus{border-color:var(--text3)}
.doc-scope-clear{height:30px;padding:0 10px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);
  color:var(--text3);font-family:var(--font);font-size:11px;cursor:pointer;white-space:nowrap}
.doc-scope-clear:hover{color:var(--text);background:var(--surface-h)}
.doc-scope-selected{font-size:11px;color:var(--text4);padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-scope-tree{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:2px;padding-right:2px}
.doc-tree-row{display:grid;grid-template-columns:22px 16px minmax(0,1fr) auto;align-items:center;gap:7px;
  min-height:32px;padding:5px 8px 5px calc(8px + var(--depth,0)*16px);border-radius:var(--rs);font-size:12px;color:var(--text3)}
.doc-tree-row:hover{background:var(--surface)}
.doc-tree-row input{width:14px;height:14px;accent-color:var(--text2)}
.doc-tree-toggle{width:20px;height:20px;border:none;background:none;color:var(--text4);font-family:var(--font);font-size:12px;cursor:pointer;border-radius:4px;padding:0}
.doc-tree-toggle:hover{background:var(--surface-h);color:var(--text2)}
.doc-tree-toggle.placeholder{visibility:hidden;pointer-events:none}
.doc-tree-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}
.doc-tree-count{font-size:10px;color:var(--text4);white-space:nowrap}
.doc-tree-empty{font-size:12px;color:var(--text4);padding:18px;text-align:center;border:1px dashed var(--border);border-radius:var(--rs)}
.doc-tree-row.file .doc-tree-name{color:var(--text3)}
/* Chip selector */
.chip-select{position:relative}
.chip-box{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:40px;padding:6px 10px;
  background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);cursor:text;transition:border .15s}
.chip-box:focus-within{border-color:var(--text3)}
.chip-box input{flex:1;min-width:80px;background:none;border:none;outline:none;color:var(--text);
  font-family:var(--font);font-size:12px}
.chip-box input::placeholder{color:var(--text4)}
.api-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 10px;border-radius:20px;
  font-size:11px;font-weight:450;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:var(--text2);
  animation:chipIn .2s ease;white-space:nowrap}
@keyframes chipIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.api-chip .ctype{font-size:8px;padding:1px 4px;border-radius:8px;text-transform:uppercase;font-weight:600;letter-spacing:.03em}
.api-chip .ctype.mock{background:rgba(234,179,8,.12);color:var(--amber)}
.api-chip .ctype.realtime{background:rgba(34,197,94,.12);color:var(--green)}
.api-chip .ctype.handoff{background:rgba(20,184,166,.14);color:#5eead4}
.api-chip .cx{width:14px;height:14px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;cursor:pointer;color:var(--text4);font-size:10px;transition:.15s;flex-shrink:0}
.api-chip .cx:hover{background:rgba(255,255,255,.1);color:var(--text2)}
.chip-dd{position:absolute;left:0;right:0;top:100%;margin-top:4px;max-height:180px;overflow-y:auto;
  background:rgba(20,20,22,.97);border:1px solid rgba(255,255,255,.08);border-radius:var(--rs);
  backdrop-filter:blur(20px);box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:10;display:none}
.chip-dd.open{display:block}
.chip-dd-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:.12s;font-size:12px}
.chip-dd-item:hover{background:rgba(255,255,255,.05)}
.chip-dd-item .cdi-name{font-weight:500;color:var(--text)}
.chip-dd-item .cdi-desc{font-size:10px;color:var(--text4);margin-left:auto;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-dd-item .cdi-type{font-size:8px;padding:1px 5px;border-radius:8px;text-transform:uppercase;font-weight:600}
.chip-dd-item .cdi-type.mock{background:rgba(234,179,8,.12);color:var(--amber)}
.chip-dd-item .cdi-type.realtime{background:rgba(34,197,94,.12);color:var(--green)}
.chip-dd-item .cdi-type.handoff{background:rgba(20,184,166,.14);color:#5eead4}
.chip-dd-empty{padding:16px;text-align:center;font-size:11px;color:var(--text4)}

/* ── SIDEBAR COMPONENTS ──────────────────────────────────── */
.upload-zone{border:1.5px dashed var(--border);border-radius:var(--rs);padding:24px 16px;
  text-align:center;cursor:pointer;transition:.2s;margin-bottom:14px}
.upload-zone:hover,.upload-zone.drag{border-color:var(--text3);background:var(--surface)}
.upload-zone p{font-size:11px;color:var(--text4)}
.upload-zone .uz-icon{font-size:20px;margin-bottom:6px;opacity:.4}
.item-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);
  padding:10px 12px;display:flex;align-items:center;gap:10px;transition:.15s}
.item-card:hover{background:var(--surface-h)}
.item-icon{font-size:16px;opacity:.5;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-info .name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-info .meta{font-size:10px;color:var(--text4);margin-top:2px;display:flex;gap:8px}
.item-del{background:none;border:none;color:var(--text4);cursor:pointer;font-size:12px;padding:4px;border-radius:4px;transition:.15s;opacity:0}
.item-card:hover .item-del{opacity:1}
.item-del:hover{color:var(--red)}
.api-add-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:8px;
  background:var(--surface);border:1px dashed var(--border);border-radius:var(--rs);color:var(--text3);
  font-size:12px;font-weight:450;cursor:pointer;font-family:var(--font);transition:.2s;margin-bottom:10px}
.api-add-btn:hover{border-color:var(--border-h);color:var(--text2)}
.api-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;transition:.15s}
.api-card:hover{background:var(--surface-h)}
.api-card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.api-card-name{font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}
.api-type{font-size:9px;padding:2px 6px;border-radius:10px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.api-type.mock{background:rgba(234,179,8,.1);color:var(--amber)}
.api-type.realtime{background:rgba(34,197,94,.1);color:var(--green)}
.api-type.handoff{background:rgba(20,184,166,.14);color:#5eead4}
.api-card-desc{font-size:10px;color:var(--text4);margin-bottom:4px;line-height:1.4}
.api-fields{display:flex;flex-wrap:wrap;gap:3px}
.api-ftag{font-size:9px;padding:2px 5px;border-radius:3px;background:var(--bg);color:var(--text4);border:1px solid var(--border)}

/* ── MODAL ───────────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);z-index:50;
  display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg1);border:1px solid var(--border);border-radius:16px;
  width:560px;max-height:85vh;overflow-y:auto;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.modal h3{font-size:17px;font-weight:600;margin-bottom:20px;letter-spacing:-.02em}
.doc-view-modal{width:min(980px,calc(100vw - 32px));height:min(780px,calc(100vh - 32px));display:flex;flex-direction:column;overflow:hidden}
.doc-view-modal h3{margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-view-path{font-size:11px;color:var(--text4);margin-bottom:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-view-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.doc-view-tab{height:30px;padding:0 11px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);
  color:var(--text3);font-family:var(--font);font-size:12px;cursor:pointer}
.doc-view-tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.doc-view-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.doc-view-chip{font-size:10px;color:var(--text4);border:1px solid var(--border);border-radius:999px;padding:3px 8px;background:var(--surface)}
.doc-view-body{flex:1;min-height:0;overflow:auto;border:1px solid var(--border);border-radius:var(--rs);background:var(--bg);padding:16px}
.doc-view-pre{font-family:var(--font-mono);font-size:12px;line-height:1.65;white-space:pre-wrap;color:var(--text2);word-break:break-word}
.doc-view-empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--text4);font-size:12px;text-align:center}
.doc-view-list{display:flex;flex-direction:column;gap:10px}
.doc-view-item{border:1px solid var(--border);border-radius:var(--rs);background:var(--surface);padding:11px 12px}
.doc-view-item-title{font-size:12px;color:var(--text2);font-weight:500;margin-bottom:6px}
.doc-view-item-meta{font-size:10px;color:var(--text4);margin-bottom:6px}
.doc-view-item-text{font-size:12px;color:var(--text3);line-height:1.55;white-space:pre-wrap;word-break:break-word}
.mf{margin-bottom:16px}
.mf label{display:block;font-size:11px;font-weight:500;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.mf input[type=text],.mf textarea,.mf select{width:100%;background:var(--bg);color:var(--text);
  border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;font-family:var(--font);
  font-size:13px;outline:none;transition:border .15s}
.mf input:focus,.mf textarea:focus{border-color:var(--text3)}
.mf textarea{resize:vertical;min-height:60px}
.mf .hint{font-size:10px;color:var(--text4);margin-top:3px}
.msec{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.msec:last-of-type{border-bottom:none}
.msec h4{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.mbtn{padding:8px 20px;border-radius:var(--rs);font-family:var(--font);font-size:13px;
  font-weight:500;cursor:pointer;border:none;transition:.15s}
.mbtn.primary{background:var(--text);color:var(--bg)}
.mbtn.primary:hover{opacity:.9}
.mbtn.secondary{background:var(--surface);color:var(--text2);border:1px solid var(--border)}
.mbtn.secondary:hover{background:var(--surface-h)}
.mbtn.danger{background:transparent;color:var(--red);border:1px solid rgba(239,68,68,.2)}
.mbtn.danger:hover{background:rgba(239,68,68,.06)}
.vibe-preview{width:100%;height:36px;border-radius:var(--rs);margin-bottom:10px;transition:background .3s;border:1px solid var(--border)}
.vibe-colors{display:flex;gap:10px;align-items:center}
.vibe-colors input[type=color]{width:36px;height:28px;border:1px solid var(--border);border-radius:6px;
  background:var(--bg);cursor:pointer;padding:2px}
.vibe-presets{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.vibe-presets button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.15s}
.vibe-presets button:hover{transform:scale(1.15)}
.tool-picker{display:flex;flex-direction:column;gap:5px;max-height:160px;overflow-y:auto}
.tp-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--rs);
  background:var(--surface);border:1px solid var(--border);font-size:12px}
.tp-row input[type=checkbox]{accent-color:var(--text2);width:15px;height:15px;cursor:pointer}
.tp-row .tname{font-weight:500;flex:1}.tp-row .tdesc{color:var(--text4);font-size:10px}
.inline-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline-grid select,.inline-grid input[type=range]{width:100%}
select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--rs);
  padding:9px 12px;font-family:var(--font);font-size:13px;outline:none;cursor:pointer}
input[type=range]{-webkit-appearance:none;height:3px;border-radius:3px;background:rgba(255,255,255,.08);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--text);cursor:pointer}
.fields-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.field-row{display:flex;gap:5px;align-items:center}
.field-row input{flex:1}.field-row select{width:80px;flex-shrink:0;padding:7px 8px;font-size:12px}
.field-row .field-req{width:28px;height:28px;accent-color:var(--text2);cursor:pointer}
.field-row .rm-field{background:none;border:none;color:var(--text4);cursor:pointer;font-size:14px;padding:3px;opacity:.5}
.field-row .rm-field:hover{color:var(--red);opacity:1}
.add-field-btn{background:none;border:1px dashed var(--border);border-radius:var(--rs);
  padding:6px;color:var(--text4);font-size:11px;cursor:pointer;font-family:var(--font);width:100%;text-align:center;transition:.15s}
.add-field-btn:hover{border-color:var(--text3);color:var(--text3)}
.mode-toggle{display:flex;border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;margin-bottom:14px}
.mode-toggle button{flex:1;padding:8px;background:none;border:none;color:var(--text4);font-family:var(--font);font-size:12px;cursor:pointer;transition:.15s}
.mode-toggle button.active{background:var(--surface);color:var(--text)}
.mf input[type=password]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--rs);
  padding:9px 12px;font-family:var(--font);font-size:13px;outline:none;transition:border .15s}
.mf label.model-check{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);text-transform:none;letter-spacing:0;margin:0;cursor:pointer}
.model-stage-row{display:flex;gap:18px;flex-wrap:wrap}
.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.key-row{display:flex;gap:8px}.key-row input{flex:1;min-width:0}.key-row .mbtn{padding:8px 14px;flex-shrink:0}
.model-test-status{font-size:11px;margin-top:6px;color:var(--text4);min-height:14px}
.model-test-status.ok{color:var(--green)}.model-test-status.err{color:var(--red)}
.model-note{font-size:12px;color:var(--text3);line-height:1.6;padding:12px;border:1px solid var(--border);border-radius:var(--rs);background:var(--surface)}
.curl-parse-btn{padding:5px 12px;border-radius:var(--rs);background:var(--surface);
  color:var(--text2);border:1px solid var(--border);font-size:11px;cursor:pointer;font-family:var(--font);margin-top:4px}
.parsed-info{margin-top:6px;padding:8px;background:rgba(34,197,94,.04);border:1px solid rgba(34,197,94,.1);
  border-radius:var(--rs);font-size:11px;color:var(--green)}

/* ── UTILS ───────────────────────────────────────────────── */
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:4px}
.toast-wrap{position:fixed;top:16px;right:16px;z-index:100;display:flex;flex-direction:column;gap:6px}
.toast{padding:8px 14px;border-radius:var(--rs);font-size:12px;font-weight:450;
  animation:toastIn .3s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(12px)}
.toast.info{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.15);color:var(--blue)}
.toast.success{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.15);color:var(--green)}
.toast.error{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15);color:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.empty{color:var(--text4);font-size:12px;text-align:center;padding:24px;line-height:1.6}

/* ── Guided Tour ─────────────────────────────────────────── */
.tour-root[hidden]{display:none}
.tour-root{position:fixed;inset:0;z-index:9000;pointer-events:none}
.tour-scrim{position:fixed;background:rgba(0,0,0,.62);backdrop-filter:blur(2px);pointer-events:auto;
  transition:top .18s,left .18s,width .18s,height .18s}
.tour-focus{position:fixed;border:1.5px solid rgba(255,255,255,.82);border-radius:14px;
  box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 36px rgba(var(--agent-c1),.32);
  transition:top .18s,left .18s,width .18s,height .18s,border-radius .18s;pointer-events:auto}
.tour-card{position:fixed;width:min(350px,calc(100vw - 32px));padding:16px;border-radius:12px;
  background:rgba(20,20,22,.98);border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 70px rgba(0,0,0,.65);
  color:var(--text);pointer-events:auto;transition:top .18s,left .18s}
.tour-card::before{content:'';position:absolute;width:10px;height:10px;background:inherit;border-left:1px solid rgba(255,255,255,.1);
  border-top:1px solid rgba(255,255,255,.1);transform:rotate(45deg);top:-6px;left:28px}
.tour-card.above::before{top:auto;bottom:-6px;transform:rotate(225deg)}
.tour-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text4);font-weight:600;margin-bottom:8px}
.tour-title{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.tour-text{font-size:12px;line-height:1.55;color:var(--text3);margin-bottom:14px}
.tour-progress{height:3px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:14px}
.tour-progress span{display:block;height:100%;width:0;background:var(--text);transition:width .18s}
.tour-actions{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.tour-count{margin-right:auto;font-size:11px;color:var(--text4);font-variant-numeric:tabular-nums}
.tour-btn{height:30px;min-width:64px;padding:0 12px;border-radius:8px;border:1px solid var(--border);
  font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;transition:.15s}

<script>
const WS_URL=`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/voice`;
const API=location.origin;
const INPUT_SR=16000,OUTPUT_SR=24000;
const BARGE_IN_RMS=0.022;
let allAgents=[],allTools=[],allDocs=[],allCollections=[],docTree=null,currentDocPath='',activeAgentId=null;

/* ── Orb (3D HD with particles) ───────────────────────────── */
class OrbVisualizer{
  constructor(c){
    this.c=c;this.ctx=c.getContext('2d');
    this.w=c.width;this.h=c.height;
    this.cx=this.w/2;this.cy=this.h/2;
    this.baseR=90;this.amp=0;this.targetAmp=0;
    this.state='idle';this.t=0;
    this.c1='161,161,170';this.c2='113,113,122';
    this.fx='161,161,170';
    // Cinematic effects
    this.burst=0;                      // 0..1 — call-start / tool-dispatch pulse
    this.zeroG=0;this.zeroGTarget=0;   // eased — slows particles like zero-gravity
    this.dreamy=0;this.dreamyTarget=0; // eased — warm Morning-Glass palette mix
    this.onCall=0;this.onCallTarget=0; // eased — asteroid ring opacity
    this.particles=[];this.orbitParticles=[];this.innerParticles=[];
    this.asteroids=[];                 // polygon "asteroids" orbiting the orb on call
    this._initParticles();
    this._initAsteroids();
    this._raf();
  }
  /* Kick the orb: radius swells, particles get pulled inward + enlarged */
  startBurst(s=1){ this.burst=Math.max(this.burst,Math.min(1,s)); }
  /* Enter/leave zero-gravity floaty state (for tool-call duration) */
  setZeroG(on){ this.zeroGTarget=on?1:0; }
  /* Enter/leave dreamy warm palette (syncs with Morning Glass hold music) */
  setDreamy(on){ this.dreamyTarget=on?1:0; }
  /* Toggle polygon asteroids orbiting the orb (on during an active call) */
  setOnCall(on){ this.onCallTarget=on?1:0; }
  /* Mix two "r,g,b" strings; t=0 returns a, t=1 returns b */
  _mixCol(a,b,t){
    const pa=a.split(',').map(Number),pb=b.split(',').map(Number);
    return pa.map((v,i)=>Math.round(v+(pb[i]-v)*t)).join(',');
  }
  _initParticles(){
    // Ambient dust
    for(let i=0;i<50;i++) this.particles.push({
      x:Math.random()*this.w, y:Math.random()*this.h,
      r:Math.random()*1.5+0.3, vx:(Math.random()-.5)*.3, vy:(Math.random()-.5)*.3,
      alpha:Math.random()*.25+.05, phase:Math.random()*Math.PI*2
    });
    // Orbit particles — each has a tilted orbital plane for true 3D carousel motion
    for(let i=0;i<24;i++){
      const dist=this.baseR*(1.08+Math.random()*.55);
      const baseSpeed=1.1*Math.pow(this.baseR*1.15/dist,1.3);
      this.orbitParticles.push({
        angle:Math.random()*Math.PI*2,
        dist,
        ecc:Math.random()*0.25,                          // mild eccentricity
        argPeri:Math.random()*Math.PI*2,
        speed:baseSpeed*(Math.random()>.5?1:-1),
        r:Math.random()*2+.5, alpha:Math.random()*.45+.2,
        phi:(Math.random()-.5)*Math.PI*.9,
        yaw:Math.random()*Math.PI*2,
        phiVel:(Math.random()-.5)*.05,
        yawVel:(Math.random()-.5)*.08,
        bobFreq:.6+Math.random()*1.4,
        bobAmp:.03+Math.random()*.06,
        phase:Math.random()*Math.PI*2
      });
    }
    // Inner sparks
    for(let i=0;i<18;i++) this.innerParticles.push({
      angle:Math.random()*Math.PI*2,
      dist:Math.random()*this.baseR*.65,
      speed:.15+Math.random()*.35,
      r:Math.random()*1.2+.4, alpha:Math.random()*.35+.1,
      phase:Math.random()*Math.PI*2
    });
  }
  _initAsteroids(){
    // Polygon asteroids orbit at multiple radii on tilted 3D planes.
    for(let i=0;i<10;i++){
      const dist=this.baseR*(2.2+Math.random()*2.6);
      // Keplerian-ish: closer orbits whip faster. Randomize direction.
      const baseSpeed=0.55*Math.pow(this.baseR*2.2/dist,1.3);
      this.asteroids.push({
        angle:Math.random()*Math.PI*2,
        dist,
        a:dist,                                         // semi-major axis
        ecc:Math.random()*0.35+0.05,                    // 0.05..0.4 eccentricity
        argPeri:Math.random()*Math.PI*2,                // argument of periapsis (ellipse rotation in plane)
        speed:baseSpeed*(Math.random()>.5?1:-1),
        size:18+Math.random()*26,                       // big
        sides:5+Math.floor(Math.random()*4),            // 5..8
        rot:Math.random()*Math.PI*2,
        vrot:(Math.random()-.5)*.6,
        // 3D tumble — Euler angles around world X, Y, and own-plane spin
        tumbX:Math.random()*Math.PI*2,
        tumbY:Math.random()*Math.PI*2,
        vtumbX:(Math.random()-.5)*1.1,
        vtumbY:(Math.random()-.5)*1.1,
        // 3D orbital plane — random tilt and yaw, slowly precesses
        phi:(Math.random()-.5)*Math.PI*.7,
        yaw:Math.random()*Math.PI*2,
        phiVel:(Math.random()-.5)*.04,                  // plane tumbles slowly
        yawVel:(Math.random()-.5)*.06,                  // plane precesses
        // small radial/vertical wobbles for organic motion
        bobFreq:.4+Math.random()*.9,
        bobAmp:.04+Math.random()*.08,
        phase:Math.random()*Math.PI*2,
        alpha:.12+Math.random()*.14
      });
    }
  }
  setState(s){this.state=s}
  setAmp(a){this.targetAmp=Math.min(1,a)}
  setColors(c1,c2){this.c1=c1;this.c2=c2}
  setEffectColor(c){this.fx=c||this.c1}
  /* Compute the 3D world point for an orbit (angle, radius) on plane (phi, yaw). */
  _orbitWorld(angle,radius,phi,yaw){
    let lx=Math.cos(angle)*radius, ly=0, lz=Math.sin(angle)*radius;
    const cp=Math.cos(phi),sp=Math.sin(phi);
    const y1=ly*cp - lz*sp;
    const z1=ly*sp + lz*cp;
    ly=y1; lz=z1;
    const cy=Math.cos(yaw),sy=Math.sin(yaw);
    const x2=lx*cy + lz*sy;
    const z2=-lx*sy + lz*cy;
    return {x:x2,y:ly,z:z2};
  }
  /* Perspective-project a 3D world point to screen. */
  _projectPoint(wx,wy,wz){
    const CAM=this.baseR*6.5;
    const persp=CAM/(CAM-wz);
    return {x:this.cx+wx*persp,y:this.cy+wy*persp,scale:persp,depth:wz};
  }
  /* Back-compat wrapper: orbit angle/radius → screen. */
  _project(angle,radius,phi,yaw){
    const w=this._orbitWorld(angle,radius,phi,yaw);
    const p=this._projectPoint(w.x,w.y,w.z);
    return {x:p.x,y:p.y,scale:p.scale,depth:w.z/radius};
  }
  _raf(){
    this.t+=.016;this.amp+=(this.targetAmp-this.amp)*.12;
    // Ease cinematic modifiers
    this.zeroG+=(this.zeroGTarget-this.zeroG)*.05;
    this.dreamy+=(this.dreamyTarget-this.dreamy)*.04;
    this.onCall+=(this.onCallTarget-this.onCall)*.04;
    this.burst*=.955; if(this.burst<.002)this.burst=0;
    if(this.state==='idle'||this.state==='listening')this.targetAmp*=.97;
    const ctx=this.ctx;ctx.clearRect(0,0,this.w,this.h);
    // Swap to warm "Morning Glass" palette when dreamy
    const _oc1=this.c1,_oc2=this.c2,_ofx=this.fx;
    if(this.dreamy>.01){
      this.c1=this._mixCol(_oc1,'255,214,170',this.dreamy*.6);
      this.c2=this._mixCol(_oc2,'198,168,230',this.dreamy*.55);
      this.fx=this._mixCol(_ofx,'255,226,190',this.dreamy*.45);
    }
    let glow,ps=2,pa=.04,pAct=.3;
    switch(this.state){
      case'idle':glow=.08;ps=1.2;pa=.015;pAct=.3;break;
      case'listening':glow=.18;pa=.04+this.amp*.25;pAct=.6+this.amp*.4;break;
      case'processing':glow=.15;ps=3;pa=.03;pAct=.8;break;
      case'speaking':glow=.25;pa=.05+this.amp*.3;pAct=.7+this.amp*.3;break;
      default:glow=.08;pAct=.3;
    }
    // Zero-gravity brightens things slightly (suspended dust catches light)
    glow+=this.dreamy*.06;
    const pulse=Math.sin(this.t*ps)*pa;
    // Call-start / tool burst makes the orb swell outward
    const burstR=1+this.burst*.28;
    const r=this.baseR*(1+pulse+this.amp*.12)*burstR;
    // ── Background nebula ──
    const bg=ctx.createRadialGradient(this.cx,this.cy,r*.3,this.cx,this.cy,r*4);
    bg.addColorStop(0,`rgba(${this.c1},${glow*.45})`);bg.addColorStop(.4,`rgba(${this.c2},${glow*.15})`);
    bg.addColorStop(1,'transparent');ctx.fillStyle=bg;ctx.fillRect(0,0,this.w,this.h);
    // ── Ambient dust particles ──
    this._drawDust(ctx,r,pAct);
    // ── BACK-SIDE orbit particles + asteroids (behind the sphere) ──
    this._drawOrbits(ctx,r,pAct,-1,true);
    if(this.onCall>.01) this._drawAsteroids(ctx,r,-1,true);
    // ── Outer aura ──
    ctx.beginPath();ctx.arc(this.cx,this.cy,r*1.5,0,Math.PI*2);
    const oa=ctx.createRadialGradient(this.cx,this.cy,r*.85,this.cx,this.cy,r*1.5);
    oa.addColorStop(0,`rgba(${this.c1},${glow*.45})`);oa.addColorStop(1,'transparent');
    ctx.fillStyle=oa;ctx.fill();
    // ── Shadow depth ──
    ctx.beginPath();ctx.arc(this.cx+r*.08,this.cy+r*.12,r*1.08,0,Math.PI*2);
    const sd=ctx.createRadialGradient(this.cx+r*.08,this.cy+r*.12,r*.6,this.cx,this.cy,r*1.08);
    sd.addColorStop(0,`rgba(${this.c2},.07)`);sd.addColorStop(1,'transparent');
    ctx.fillStyle=sd;ctx.fill();
    // ── Main sphere (3D lit) ──
    ctx.beginPath();ctx.arc(this.cx,this.cy,r,0,Math.PI*2);
    const mg=ctx.createRadialGradient(this.cx-r*.3,this.cy-r*.3,r*.04,this.cx+r*.1,this.cy+r*.15,r);
    mg.addColorStop(0,'rgba(255,255,255,.13)');
    mg.addColorStop(.25,`rgba(${this.c1},.38)`);
    mg.addColorStop(.6,`rgba(${this.c2},.22)`);
    mg.addColorStop(.85,`rgba(${this.c2},.08)`);
    mg.addColorStop(1,`rgba(${this.c2},.02)`);
    ctx.fillStyle=mg;ctx.fill();
    // ── Glass reflection arc ──
    ctx.save();ctx.beginPath();ctx.arc(this.cx,this.cy,r,0,Math.PI*2);ctx.clip();
    ctx.beginPath();ctx.ellipse(this.cx-r*.18,this.cy-r*.42,r*.55,r*.18,-0.4,0,Math.PI*2);
    const gl=ctx.createRadialGradient(this.cx-r*.18,this.cy-r*.42,0,this.cx-r*.18,this.cy-r*.42,r*.55);
    gl.addColorStop(0,`rgba(255,255,255,${.07+glow*.25})`);gl.addColorStop(1,'transparent');
    ctx.fillStyle=gl;ctx.fill();ctx.restore();
    // ── Fresnel rim ──
    ctx.beginPath();ctx.arc(this.cx,this.cy,r,0,Math.PI*2);
    const fr=ctx.createRadialGradient(this.cx,this.cy,r*.72,this.cx,this.cy,r);
    fr.addColorStop(0,'transparent');fr.addColorStop(.82,'transparent');
    fr.addColorStop(1,`rgba(${this.c1},${.12+glow*.55})`);
    ctx.fillStyle=fr;ctx.fill();
    // ── Specular highlight ──
    const sx=this.cx-r*.28,sy=this.cy-r*.3;
    ctx.beginPath();ctx.arc(sx,sy,r*.35,0,Math.PI*2);
    const sp=ctx.createRadialGradient(sx,sy,0,sx,sy,r*.35);
    sp.addColorStop(0,`rgba(255,255,255,${.08+glow*.35})`);sp.addColorStop(1,'transparent');
    ctx.fillStyle=sp;ctx.fill();
    // ── Inner core glow ──
    const cr=r*(.22+Math.sin(this.t*1.5)*.04);
    ctx.beginPath();ctx.arc(this.cx,this.cy,cr,0,Math.PI*2);
    const cg=ctx.createRadialGradient(this.cx,this.cy,0,this.cx,this.cy,cr);
    cg.addColorStop(0,`rgba(255,255,255,${.18+this.amp*.15})`);cg.addColorStop(.5,`rgba(${this.c1},${.12+this.amp*.1})`);
    cg.addColorStop(1,'transparent');ctx.fillStyle=cg;ctx.fill();
    // ── Inner sparks ──
    this._drawInner(ctx,r);
    // ── FRONT-SIDE orbit particles + asteroids (in front of sphere) ──
    this._drawOrbits(ctx,r,pAct,+1,false);
    if(this.onCall>.01) this._drawAsteroids(ctx,r,+1,false);
    // ── Surface waves ──
    if(this.state==='listening'||this.state==='speaking') this._drawWaves(ctx,r);
    // ── Processing ring ──
    if(this.state==='processing') this._drawRing(ctx,r);
    // ── Burst shockwave (call start / tool dispatch) ──
    if(this.burst>.01){
      const br=r*(1+(1-this.burst)*1.4);
      ctx.beginPath();ctx.arc(this.cx,this.cy,br,0,Math.PI*2);
      ctx.strokeStyle=`rgba(${this.fx},${this.burst*.35})`;
      ctx.lineWidth=1.5+this.burst*1.5;ctx.stroke();
      // soft outer halo during burst
      const bh=ctx.createRadialGradient(this.cx,this.cy,r*.9,this.cx,this.cy,r*2.2);
      bh.addColorStop(0,`rgba(${this.fx},${this.burst*.18})`);bh.addColorStop(1,'transparent');
      ctx.fillStyle=bh;ctx.beginPath();ctx.arc(this.cx,this.cy,r*2.2,0,Math.PI*2);ctx.fill();
    }
    // Restore base palette (dreamy blend applied only this frame)
    this.c1=_oc1;this.c2=_oc2;this.fx=_ofx;

  /* ── Ambient dust ── */
  _drawDust(ctx,r,act){
    const zg=this.zeroG, slow=1-zg*.8;             // motion damper
    const burst=this.burst;
    for(const p of this.particles){
      // Gravity-well pull toward orb during burst — particles rush in and enlarge
      if(burst>.02){
        const dx0=this.cx-p.x,dy0=this.cy-p.y;
        const dd=Math.sqrt(dx0*dx0+dy0*dy0)||1;
        const pull=burst*.055*(1-Math.min(1,dd/(r*2.6)));

      if(zg>.05){
        const dx=this.cx-p.x,dy=this.cy-p.y;
        p.vx+=(-dy*.00015 - p.vx*.04)*zg;
        p.vy+=( dx*.00015 - p.vy*.04)*zg;
      }
      p.x+=p.vx*(.5+act)*slow;p.y+=p.vy*(.5+act)*slow;p.phase+=.01*slow;
      const dx=this.cx-p.x,dy=this.cy-p.y,dist=Math.sqrt(dx*dx+dy*dy);

      const sz=p.r*(dist<r*2?1+act*.5:1)*(1+burst*1.8+zg*.25);

      ctx.fillStyle=`rgba(${col},${dist<r*2?a*1.5:a})`;ctx.fill();

  /* ── Orbit particles with trails (true 3D, perspective-projected)
     side: -1 → back, +1 → front, 0 → both                            */
  _drawOrbits(ctx,r,act,side=0,advance=true){
    const slow=1-this.zeroG*.82;
    const burst=this.burst;
    const dt=.016*slow;
    const projected=this.orbitParticles.map(p=>{
      if(advance){
        p.angle+=p.speed*dt*(.5+act);
        p.yaw+=p.yawVel*dt;
        p.phi+=p.phiVel*dt;
      }
      // Ellipse radius at true anomaly: r = a(1-e²)/(1+e·cos(ν))
      const nu=p.angle-p.argPeri;

      const bob=Math.sin(this.t*p.bobFreq+p.phase)*p.bobAmp*p.dist;

      const prv=this._project(p.angle-p.speed*.08*slow,d,p.phi,p.yaw);
      return {p,cur,prv,d};
    }).sort((A,B)=>A.cur.depth-B.cur.depth);
    for(const {p,cur,prv} of projected){
      if(side<0 && cur.depth>=0) continue;
      if(side>0 && cur.depth<0) continue;
      const df=(cur.depth+1)*.5;
      const a=p.alpha*act*(1+burst*.6)*(.35+df*.85);
      const sz=p.r*(.8+act*.4)*cur.scale*(1+burst*1.4+this.zeroG*.2);
      ctx.beginPath();ctx.moveTo(prv.x,prv.y);ctx.lineTo(cur.x,cur.y);
      ctx.strokeStyle=`rgba(${this.fx},${a*.35})`;ctx.lineWidth=p.r*.7*cur.scale*(1+burst);ctx.stroke();
      ctx.beginPath();ctx.arc(cur.x,cur.y,sz,0,Math.PI*2);
      ctx.fillStyle=`rgba(${this.fx},${a})`;ctx.fill();
      ctx.beginPath();ctx.arc(cur.x,cur.y,sz*3.5,0,Math.PI*2);
      const pg=ctx.createRadialGradient(cur.x,cur.y,0,cur.x,cur.y,sz*3.5);
      pg.addColorStop(0,`rgba(${this.fx},${a*.3+burst*.1})`);pg.addColorStop(1,'transparent');
      ctx.fillStyle=pg;ctx.fill();
    }
  }
  /* ── Inner sparks ── */
  _drawInner(ctx,r){
    const slow=1-this.zeroG*.85;
    ctx.save();ctx.beginPath();ctx.arc(this.cx,this.cy,r*.92,0,Math.PI*2);ctx.clip();
    for(const p of this.innerParticles){
      p.angle+=p.speed*.016*slow;
      const d=p.dist+Math.sin(this.t*.8+p.phase)*(12+this.zeroG*8);
      const x=this.cx+Math.cos(p.angle)*d,y=this.cy+Math.sin(p.angle)*d;
      const a=p.alpha*(.5+this.amp*.5+this.burst*.4);
      const sz=p.r*(1+this.burst*1.2+this.zeroG*.2);
      ctx.beginPath();ctx.arc(x,y,sz,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill();
      // soft bloom
      ctx.beginPath();ctx.arc(x,y,sz*2.5,0,Math.PI*2);
      const ig=ctx.createRadialGradient(x,y,0,x,y,sz*2.5);
      ig.addColorStop(0,`rgba(${this.fx},${a*.3})`);ig.addColorStop(1,'transparent');
      ctx.fillStyle=ig;ctx.fill();

  }
  /* ── Surface waves ── */
  _drawWaves(ctx,r){

      ctx.beginPath();

        const n=Math.sin(a*4+this.t*2.5+off)*(2+this.amp*20)

  /* ── Polygon asteroids orbiting the orb (true 3D carousel w/ tumble)

  _drawAsteroids(ctx,r,side=0,advance=true){
    const slow=1-this.zeroG*.75;
    const gain=this.onCall;
    const dt=.016*slow;
    const proj=this.asteroids.map(a=>{
      if(advance){
        a.angle+=a.speed*dt;
        a.rot+=a.vrot*dt;
        a.yaw+=a.yawVel*dt;
        a.phi+=a.phiVel*dt;

        a.tumbY+=a.vtumbY*dt;

      const bob=Math.sin(this.t*a.bobFreq+a.phase)*a.bobAmp*a.dist;
      const d=eR+bob+this.burst*10;
      const w=this._orbitWorld(a.angle,d,a.phi,a.yaw);
      return {a,w,depth:w.z/d};
    }).sort((A,B)=>A.depth-B.depth);
    for(const {a,w,depth} of proj){
      if(side<0 && depth>=0) continue;
      if(side>0 && depth<0) continue;

      const al=a.alpha*gain*(.25+df*.95);
      const sz=a.size*(1+this.burst*.25);

  /* Rotate a 3-vec: first around world X by tx, then around world Y by ty. */
  _rotXY(v,tx,ty){
    const cx=Math.cos(tx),sx=Math.sin(tx);
    let y=v.y*cx - v.z*sx, z=v.y*sx + v.z*cx, x=v.x;
    const cy=Math.cos(ty),sy=Math.sin(ty);

  }
  _drawPolyAsteroid3D(ctx,center,r,spin,tumbX,tumbY,sides,alpha,df){
    if(alpha<.005)return;
    // Build 3D vertices in a local frame (z=0 face), rotated by spin (around z),
    // then tumbled by tumbX (world X) and tumbY (world Y), then translated to center.
    const verts=[];
    const cs=Math.cos(spin),sn=Math.sin(spin);
    let zMin=Infinity,zMax=-Infinity;
    for(let i=0;i<sides;i++){
      const ang=i*Math.PI*2/sides - Math.PI/2;
      const jit=1+Math.sin(i*2.3+sides)*.08;
      const lx0=Math.cos(ang)*r*jit, ly0=Math.sin(ang)*r*jit;
      // apply spin (rotation in local plane, around local Z)
      const lx=lx0*cs - ly0*sn;
      const ly=lx0*sn + ly0*cs;
      // tumble
      const t=this._rotXY({x:lx,y:ly,z:0},tumbX,tumbY);
      // translate to world
      const wx=center.x+t.x, wy=center.y+t.y, wz=center.z+t.z;
      if(wz<zMin)zMin=wz; if(wz>zMax)zMax=wz;
      verts.push(this._projectPoint(wx,wy,wz));
    }
    // Compute face normal (for flat-shaded lighting). Cross product of two edges.
    const e1x=verts[1].x-verts[0].x, e1y=verts[1].y-verts[0].y;
    const e2x=verts[2].x-verts[0].x, e2y=verts[2].y-verts[0].y;
    const signedArea=e1x*e2y - e1y*e2x;      // screen-space area; sign ≈ facing
    const facing=Math.min(1,Math.abs(signedArea)/(r*r*2)); // 0=edge-on, 1=face-on
    const centerPt=this._projectPoint(center.x,center.y,center.z);
    // Draw
    ctx.save();
    ctx.beginPath();
    verts.forEach((v,i)=>i===0?ctx.moveTo(v.x,v.y):ctx.lineTo(v.x,v.y));
    ctx.closePath();
    // Flat lit gradient — bright center of face when face-on, thin slice when edge-on
    const avgR=r*centerPt.scale;
    const g=ctx.createRadialGradient(
      centerPt.x-avgR*.25, centerPt.y-avgR*.25, avgR*.1,
      centerPt.x, centerPt.y, avgR*1.1);
    const faceAlpha=alpha*(.3+facing*.9);
    g.addColorStop(0,`rgba(${this.fx},${faceAlpha*1.1})`);
    g.addColorStop(.55,`rgba(${this.fx},${faceAlpha*.55})`);
    g.addColorStop(1,`rgba(${this.c2},${faceAlpha*.1})`);
    ctx.fillStyle=g;ctx.fill();
    // Edge line — more visible when tilted (adds silhouette)
    ctx.lineWidth=.9;
    ctx.strokeStyle=`rgba(${this.fx},${alpha*(df>.5?.85:.35)*(.4+(1-facing)*.9)})`;
    ctx.stroke();
    // Soft halo only for front, face-on-ish asteroids
    if(df>.55 && facing>.35){
      ctx.beginPath();ctx.arc(centerPt.x,centerPt.y,avgR*1.6,0,Math.PI*2);
      const hg=ctx.createRadialGradient(centerPt.x,centerPt.y,avgR*.9,centerPt.x,centerPt.y,avgR*1.6);
      hg.addColorStop(0,`rgba(${this.fx},${alpha*.18*facing})`);hg.addColorStop(1,'transparent');
      ctx.fillStyle=hg;ctx.fill();
    }
    ctx.restore();
  }
  /* ── Processing ring ── */
  _drawRing(ctx,r){
    const sa=this.t*3,al=Math.PI*.8+Math.sin(this.t*2)*Math.PI*.3;
    ctx.beginPath();ctx.arc(this.cx,this.cy,r+12,sa,sa+al);
    ctx.strokeStyle=`rgba(${this.fx},.3)`;ctx.lineWidth=2;ctx.lineCap='round';ctx.stroke();
    ctx.beginPath();ctx.arc(this.cx,this.cy,r+12,sa+Math.PI,sa+Math.PI+al*.6);
    ctx.strokeStyle=`rgba(${this.c2},.2)`;ctx.lineWidth=1.5;ctx.stroke();
    for(let i=0;i<5;i++){
      const ang=this.t*(2+i*.3)+i*(Math.PI*2/5);
      const d=r+12+Math.sin(this.t*2+i)*4;
      const x=this.cx+Math.cos(ang)*d,y=this.cy+Math.sin(ang)*d;
      ctx.beginPath();ctx.arc(x,y,1.8+Math.sin(this.t*3+i)*.5,0,Math.PI*2);
      ctx.fillStyle=`rgba(${this.fx},${.3+Math.sin(this.t*2+i)*.15})`;ctx.fill();
    }
  }
}

/* ── SFX Engine (Web Audio synthesis) ────────────────────── */
const SFX={
  _ctx:null,
  _getCtx(){if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();return this._ctx},
  _tone(freq,dur,type='sine',vol=0.12,ramp=0.08){
    const c=this._getCtx(),o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,c.currentTime);
    g.gain.linearRampToValueAtTime(vol,c.currentTime+ramp);
    g.gain.linearRampToValueAtTime(0,c.currentTime+dur);
    o.connect(g);g.connect(c.destination);o.start(c.currentTime);o.stop(c.currentTime+dur);
  },
  /* Two-note ascending chime — agent switch */
  agentSwitch(){
    this._tone(880,0.15,'sine',0.10,0.02);
    setTimeout(()=>this._tone(1174,0.2,'sine',0.10,0.02),100);
    setTimeout(()=>this._tone(1318,0.25,'sine',0.06,0.02),200);
  },
  /* Quick blip — tool call dispatched */
  toolCall(){
    this._tone(660,0.08,'sine',0.08,0.01);
    setTimeout(()=>this._tone(880,0.06,'sine',0.06,0.01),60);
  },
  /* Soft ding — tool result received */
  toolResult(){
    this._tone(1047,0.18,'triangle',0.09,0.01);
    setTimeout(()=>this._tone(1319,0.22,'triangle',0.07,0.02),120);
  },
  /* Gentle pulse — processing/thinking */
  processing(){
    this._tone(440,0.25,'sine',0.05,0.08);
    setTimeout(()=>this._tone(523,0.2,'sine',0.03,0.06),150);
  },
  /* Rising connection tone — call start */
  callStart(){
    this._tone(523,0.1,'sine',0.08,0.01);
    setTimeout(()=>this._tone(659,0.1,'sine',0.08,0.01),80);
    setTimeout(()=>this._tone(784,0.2,'sine',0.10,0.01),160);
  },
  /* Descending disconnect — call end */
  callEnd(){
    this._tone(784,0.1,'sine',0.07,0.01);
    setTimeout(()=>this._tone(523,0.2,'sine',0.06,0.02),100);
  },
  /* Subtle tick — message received */
  message(){this._tone(1200,0.06,'sine',0.04,0.01)},
  /* Error buzz */
  error(){this._tone(220,0.15,'sawtooth',0.06,0.01);setTimeout(()=>this._tone(196,0.2,'sawtooth',0.05,0.01),100)}
};

/* ── Hold Music (app/static/hold_music.mp3, optional) ──────────────────────────── */
const HoldMusic={
  _audio:null,_ready:false,_fadeGain:null,_ctx:null,_src:null,_wired:false,
  init(){
    this._audio=new Audio('/static/hold_music.mp3');
    this._audio.loop=true;
    this._audio.preload='auto';
    this._audio.addEventListener('canplaythrough',()=>{this._ready=true},{ once:true });
  },
  _ensureCtx(){
    if(this._wired)return;
    this._ctx=new(window.AudioContext||window.webkitAudioContext)();
    this._src=this._ctx.createMediaElementSource(this._audio);
    this._fadeGain=this._ctx.createGain();
    this._fadeGain.gain.value=0;
    this._src.connect(this._fadeGain);
    this._fadeGain.connect(this._ctx.destination);
    this._wired=true;
  },
  play(){
    if(!this._ready||!this._audio)return;
    this._ensureCtx();
    if(this._ctx.state==='suspended')this._ctx.resume();
    const now=this._ctx.currentTime;
    this._fadeGain.gain.cancelScheduledValues(now);
    this._fadeGain.gain.setValueAtTime(0,now);
    this._fadeGain.gain.linearRampToValueAtTime(0.25,now+0.8);
    this._audio.currentTime=0;
    this._audio.play().catch(()=>{});
  },
  stop(){
    if(!this._audio||!this._wired)return;
    const now=this._ctx.currentTime;
    this._fadeGain.gain.cancelScheduledValues(now);
    this._fadeGain.gain.setValueAtTime(this._fadeGain.gain.value,now);
    this._fadeGain.gain.linearRampToValueAtTime(0,now+0.5);
    setTimeout(()=>{this._audio.pause()},600);
  }
};
HoldMusic.init();

/* ── AudioManager ────────────────────────────────────────── */
class AudioManager{
  constructor(){this.audioCtx=null;this.stream=null;this.processor=null;this.micMute=null;
    this.playQueue=[];this.isPlaying=false;this.onChunk=null;this.currentSource=null;this._gen=0;
    this._sources=new Set();this._nextAt=0;this._pumping=false;
    this.playCtx=null;this.playGain=null;this.outputGain=1.8;this.lastPlaybackAt=0}
  _micConstraints(){return {
    echoCancellation:{ideal:true},noiseSuppression:{ideal:true},autoGainControl:{ideal:true},
    channelCount:{ideal:1},sampleRate:{ideal:48000},sampleSize:{ideal:16},latency:{ideal:0.02},
    googEchoCancellation:true,googEchoCancellation2:true,googDAEchoCancellation:true,
    googAutoGainControl:true,googAutoGainControl2:true,googNoiseSuppression:true,
    googNoiseSuppression2:true,googHighpassFilter:true
  }}
  _getPlaybackCtx(){
    if(!this.playCtx||this.playCtx.state==='closed'){
      this.playCtx=new(window.AudioContext||window.webkitAudioContext)();
      this.playGain=this.playCtx.createGain();
      this.playGain.gain.value=this.outputGain;
      this.playGain.connect(this.playCtx.destination);
    }
    return this.playCtx;
  }
  async unlockPlayback(){
    const p=this._getPlaybackCtx();
    if(p.state==='suspended')await p.resume().catch(()=>{});
    return p;
  }
  async startMic(){
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('Mic requires HTTPS');
    this.audioCtx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:48000});
    await this.unlockPlayback();
    if(this.audioCtx.state==='suspended')await this.audioCtx.resume().catch(()=>{});
    this.stream=await navigator.mediaDevices.getUserMedia({audio:this._micConstraints()});
    const track=this.stream.getAudioTracks()[0];
    if(track?.applyConstraints)await track.applyConstraints(this._micConstraints()).catch(()=>{});
    if(track?.getSettings)console.info('Mic AEC settings',track.getSettings());
    const src=this.audioCtx.createMediaStreamSource(this.stream);
    this.processor=this.audioCtx.createScriptProcessor(4096,1,1);
    this.processor.onaudioprocess=e=>{
      const ds=this._ds(e.inputBuffer.getChannelData(0),this.audioCtx.sampleRate,INPUT_SR);
      const i16=this._f2i(ds);if(this.onChunk)this.onChunk(i16.buffer);
    };src.connect(this.processor);this.micMute=this.audioCtx.createGain();this.micMute.gain.value=0;
    this.processor.connect(this.micMute);this.micMute.connect(this.audioCtx.destination);
  }
  stopMic(){if(this.processor){this.processor.disconnect();this.processor=null}
    if(this.micMute){this.micMute.disconnect();this.micMute=null}
    if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null}
    if(this.audioCtx){this.audioCtx.close();this.audioCtx=null}this.clearPlayback()}
  recentlyPlayed(ms=450){return performance.now()-this.lastPlaybackAt<ms}
  queueAudio(b64,sampleRate=OUTPUT_SR){const bin=atob(b64);const buf=new ArrayBuffer(bin.length);const u8=new Uint8Array(buf);
    for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);this.playQueue.push(buf);
    this.playRate=sampleRate||OUTPUT_SR;this.isPlaying=true;
    if(!this._pumping)this._play().catch(e=>{console.error('PCM playback failed',e);this.isPlaying=false;this._pumping=false})}
  clearPlayback(){this._gen++;this.playQueue=[];
    for(const s of this._sources){try{s.stop()}catch(e){}}this._sources.clear();
    this.currentSource=null;this.isPlaying=false;this._nextAt=0}
  /* Schedule queued PCM chunks back-to-back on the audio clock, so streamed
     TTS (many small chunks) plays without gaps between them. */
  async _play(){const gen=this._gen;this._pumping=true;
    try{const p=await this.unlockPlayback();if(this._gen!==gen)return;
      while(this.playQueue.length&&this._gen===gen){
        const i16=new Int16Array(this.playQueue.shift());
        const f32=new Float32Array(i16.length);for(let i=0;i<i16.length;i++)f32[i]=i16[i]/32768;
        const ab=p.createBuffer(1,f32.length,this.playRate||OUTPUT_SR);ab.getChannelData(0).set(f32);
        const s=p.createBufferSource();s.buffer=ab;s.connect(this.playGain);
        const at=Math.max(p.currentTime+0.03,this._nextAt);s.start(at);this._nextAt=at+ab.duration;
        this._sources.add(s);this.currentSource=s;
        s.onended=()=>{this._sources.delete(s);this.lastPlaybackAt=performance.now();
          if(!this._sources.size&&!this.playQueue.length&&this._gen===gen){this.currentSource=null;this.isPlaying=false}}}
      if(!this._sources.size)this.isPlaying=false}
    finally{this._pumping=false}}
  _ds(buf,from,to){if(from===to)return buf;const r=from/to;const len=Math.floor(buf.length/r);
    const o=new Float32Array(len);for(let i=0;i<len;i++)o[i]=buf[Math.round(i*r)];return o}
  _f2i(f){const i=new Int16Array(f.length);for(let j=0;j<f.length;j++){
    let s=Math.max(-1,Math.min(1,f[j]));i[j]=s<0?s*0x8000:s*0x7FFF}return i}
}

    this.ws.onmessage=e=>this._onMsg(e);
    this.ws.onclose=()=>{setWs('Offline','');setTimeout(()=>this.connect(),3000)};
    this.ws.onerror=()=>setWs('Error','');
  }
  async startCall(){
    if(ModelConfig.missingKey()){toast('Add your Gemini API key in Model settings','error');openModelModal();return}
    try{await this.audio.startMic()}catch(e){toast(e.message||'Mic failed','error');return}
    SFX.callStart();
    this.orb.startBurst(1);          // cinematic expand on call-start
    this.orb.setOnCall(true);        // polygon asteroids orbit in
    this._micPaused=false;
    this.audio.onChunk=buf=>{
      if(this._micPaused)return; // Don't send audio during tool execution
      const i16=new Int16Array(buf);let sum=0;for(let i=0;i<i16.length;i++)sum+=i16[i]*i16[i];
      const rms=Math.sqrt(sum/i16.length)/32768;this.orb.setAmp(rms*4);
      if(this._handoffActive&&this._handoffId){
        if(this.ws?.readyState===1)this.ws.send(JSON.stringify({action:'handoff_audio',handoff_id:this._handoffId,audio:arrayBufferToB64(buf),sample_rate:INPUT_SR}));
        return
      }
      const playbackActive=this.audio.isPlaying||this.audio.recentlyPlayed();
      if(playbackActive){
        if(rms<BARGE_IN_RMS){this._intFrames=0;return}
        this._intFrames++;
        if(this._intFrames>=2&&this.audio.isPlaying)this.audio.clearPlayback();
      }else this._intFrames=0;
      if(this.ws?.readyState===1)this.ws.send(buf);
    };
    this.ws.send(JSON.stringify({action:'start_call',agent_id:activeAgentId||null,model:ModelConfig.payload()}));
    this._setState('listening');
    document.getElementById('btnStart').disabled=true;
    document.getElementById('btnEnd').disabled=false;
  }
  endCall(){
    if(this.ws)this.ws.send(JSON.stringify({action:'end_call'}));
    SFX.callEnd();HoldMusic.stop();
    this._handoffWaiting=false;this._handoffActive=false;this._handoffId=null;
    this.orb.setZeroG(false);this.orb.setDreamy(false);
    this.orb.setOnCall(false);
    this.audio.stopMic();this._setState('idle');
    document.getElementById('btnStart').disabled=false;
    document.getElementById('btnEnd').disabled=true;
    document.getElementById('partialBar').textContent='';
  }
  _onMsg(e){
    if(typeof e.data!=='string')return;const m=JSON.parse(e.data);
    switch(m.type){
      case'status':this._setState(m.state);break;
      case'stt_partial':document.getElementById('partialBar').textContent=m.text;break;
      case'stt_final':document.getElementById('partialBar').textContent='';SFX.message();addMsg('user',m.text);break;
      case'llm_token':this.llmBuf+=m.token;updateBot(this.llmBuf);break;
      case'tool_call':if(this.llmBuf){finalizeBot();this.llmBuf=''}SFX.toolCall();addToolCall(m.name,m.args);break;
      case'tool_result':SFX.toolResult();addToolResult(m.name,m.result);break;
      case'handoff_status':this._handleHandoff(m.handoff);break;
      case'handoff_audio':HoldMusic.stop();if(m.audio)this.audio.queueAudio(m.audio,m.sample_rate||OUTPUT_SR);this.orb.setAmp(.5);break;
      case'tool_executing':
        this._micPaused=true;
        HoldMusic.play();
        this.orb.setAmp(.3);
        this.orb.setZeroG(true);        // suspend particles — floaty feel
        this.orb.setDreamy(true);       // warm Morning-Glass palette blend
        this.orb.startBurst(.45);       // soft pulse on dispatch
        document.getElementById('voiceLabel').textContent='Executing tool…';
        break;
      case'tool_done':
        if(this._handoffWaiting)break;
        this._micPaused=false;
        HoldMusic.stop();
        this.orb.setZeroG(false);
        this.orb.setDreamy(false);
        this.orb.startBurst(.3);        // release pulse
        break;
      case'llm_done':if(this.llmBuf)finalizeBot();this.llmBuf='';break;
      case'tts_audio':HoldMusic.stop();this.audio.queueAudio(m.audio);this.orb.setAmp(.5);break;
      case'interrupt':HoldMusic.stop();this.audio.clearPlayback();if(this.llmBuf)finalizeBot();this.llmBuf='';this._setState('listening');break;
      case'agent_switched':
        SFX.agentSwitch();
        const ag=allAgents.find(a=>a.id===m.agent_id);
        if(ag){setActiveAgent(ag.id,true);addMsg('system','Switched to '+ag.name)}break;
      case'error':SFX.error();toast(m.message,'error');break;
    }
  }
  _handleHandoff(handoff){
    if(!handoff)return;
    addHandoffStatus(handoff);
    this._handoffId=handoff.id||this._handoffId;
    if(handoff.status==='pending'){
      this._handoffWaiting=true;this._handoffActive=false;this._micPaused=true;
      HoldMusic.play();this.orb.setAmp(.3);this.orb.setZeroG(true);this.orb.setDreamy(true);
      document.getElementById('voiceLabel').textContent='Waiting for human...';
    }else if(handoff.status==='accepted'){
      this._handoffWaiting=false;this._handoffActive=true;this._micPaused=false;
      HoldMusic.stop();this.audio.clearPlayback();this.orb.setZeroG(false);this.orb.setDreamy(false);this.orb.startBurst(.5);
      document.getElementById('voiceLabel').textContent='Human connected';
    }else if(handoff.status==='resolved'||handoff.status==='cancelled'){
      this._handoffWaiting=false;this._handoffActive=false;this._micPaused=false;this._handoffId=null;
      HoldMusic.stop();this.orb.setZeroG(false);this.orb.setDreamy(false);
      this._setState('listening');
    }
  }
  _setState(s){this.state=s;if(s==='processing'){this.audio.clearPlayback();SFX.processing()}
    this.orb.setState(s);
    const labels={idle:'Press Start to begin',listening:'Listening…',processing:'Thinking…',speaking:'Speaking…'};
    document.getElementById('voiceLabel').textContent=labels[s]||s}
}

/* ── Transcript ──────────────────────────────────────────── */
let _botBubble=null;
function arrayBufferToB64(buf){
  const bytes=new Uint8Array(buf);let out='';
  for(let i=0;i<bytes.length;i+=8192){out+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192))}
  return btoa(out)
}
function addMsg(role,text){
  const el=document.getElementById('transcript');
  const ts=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const d=document.createElement('div');d.className='msg '+role;
  d.innerHTML=text+'<div class="ts">'+ts+'</div>';el.appendChild(d);el.scrollTop=el.scrollHeight;return d}
function updateBot(text){const el=document.getElementById('transcript');
  if(!_botBubble){_botBubble=addMsg('bot',text);return}
  _botBubble.innerHTML=text+'<div class="ts">'+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</div>';
  el.scrollTop=el.scrollHeight}
function finalizeBot(){_botBubble=null}
function addToolCall(name,args){
  const el=document.getElementById('transcript');const ts=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const ah=Object.entries(args||{}).map(e=>'<span style="color:var(--text2)">'+e[0]+'</span>: '+e[1]).join(', ');
  const d=document.createElement('div');d.className='msg tool-call';
  d.innerHTML='<div style="font-size:11px;font-weight:500;color:var(--text2);margin-bottom:3px">⚡ '+name+'</div><div style="font-size:11px;color:var(--text3)">'+ah+'</div><div class="ts">'+ts+'</div>';
  el.appendChild(d);el.scrollTop=el.scrollHeight}
function addToolResult(name,result){
  const el=document.getElementById('transcript');const ts=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  let rh;try{rh='<pre>'+JSON.stringify(JSON.parse(result),null,2)+'</pre>'}catch(e){rh='<div style="font-size:11px;color:var(--text3)">'+result+'</div>'}
  const d=document.createElement('div');d.className='msg tool-result';
  d.innerHTML='<div style="font-size:11px;font-weight:500;color:var(--text2);margin-bottom:3px">↳ '+name+'</div>'+rh+'<div class="ts">'+ts+'</div>';
  el.appendChild(d);el.scrollTop=el.scrollHeight}
function addHandoffStatus(handoff){
  if(!handoff)return;
  const name=handoff.accepted_by||'Human agent';
  const status=handoff.status||'pending';
  let text='Human handoff queued.';
  if(status==='accepted')text=name+' accepted the handoff.';
  if(status==='resolved')text='Human handoff resolved.';
  if(status==='cancelled')text='Human handoff cancelled.';
  if(handoff.id)text+=' <span style="color:var(--text3)">'+handoff.id+'</span>';
  addMsg('system',text)
}

function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return r+','+g+','+b}
const VIBES=[
  {name:'Silver',c1:'#a1a1aa',c2:'#71717a'},{name:'Indigo',c1:'#6366f1',c2:'#4f46e5'},
  {name:'Emerald',c1:'#10b981',c2:'#059669'},{name:'Amber',c1:'#f59e0b',c2:'#d97706'},
  {name:'Rose',c1:'#f43f5e',c2:'#e11d48'},{name:'Sky',c1:'#0ea5e9',c2:'#0284c7'},
  {name:'Violet',c1:'#8b5cf6',c2:'#7c3aed'},{name:'Teal',c1:'#14b8a6',c2:'#0d9488'},
];

function escapeHtml(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function agentEffectColor(ag,c1){return (ag&&(ag.effect_color||ag.effects_color))||c1||'#a1a1aa'}
function scopeKey(scope){return (scope.type||'folder')+':'+(scope.value||scope.path||scope.id||'')}
function scopeLabel(scope){
  if(!scope)return'';
  const type=scope.type||'folder',value=scope.value||scope.path||scope.id||'';
  if(type==='file'){const doc=allDocs.find(d=>d.id===value);return doc?(doc.relative_path||doc.filename):value}
  if(type==='collection'){const doc=allDocs.find(d=>d.collection_id===value);return doc?(doc.collection_name||'Collection'):value}
  return value?value+'/':'All documents'
}
function collectionRootFolder(collectionId){
  const roots=[...new Set(allDocs.filter(d=>d.collection_id===collectionId).map(d=>normDocPath(d.relative_path||d.filename).split('/')[0]).filter(Boolean))];
  return roots.length===1?roots[0]:'';
}
function normalizeDocScopeSelections(scopes){
  const out=[],seen=new Set();
  (scopes||[]).forEach(scope=>{
    let item={type:scope.type||'folder',value:scope.value||scope.path||scope.id||''};
    if(item.type==='collection'){const root=collectionRootFolder(item.value);if(root)item={type:'folder',value:root};else return}
    if(!item.value&&item.type!=='folder')return;
    const key=scopeKey(item);if(!seen.has(key)){seen.add(key);out.push(item)}
  });
  return out;
}
function getDocScopeOptions(){
  const folders={};
  const collections={};
  allDocs.forEach(d=>{
    const rel=(d.relative_path||d.filename||'').replace(/^\/+|\/+$/g,'');
    const parts=rel.split('/').filter(Boolean);
    for(let i=0;i<parts.length-1;i++){const path=parts.slice(0,i+1).join('/');folders[path]=(folders[path]||0)+1}
    if(d.collection_id)collections[d.collection_id]={type:'collection',value:d.collection_id,label:'Collection: '+(d.collection_name||d.collection_id),count:(collections[d.collection_id]?.count||0)+1};
  });
  const folderOpts=Object.keys(folders).sort().map(path=>({type:'folder',value:path,label:path+'/',count:folders[path]}));
  const fileOpts=folderOpts.length?[]:allDocs.slice().sort((a,b)=>(a.relative_path||a.filename||'').localeCompare(b.relative_path||b.filename||''))
    .map(d=>({type:'file',value:d.id,label:d.relative_path||d.filename,count:1}));
  return Object.values(collections).concat(folderOpts,fileOpts)
}
