// Mini aura orb animation for carousel items
const miniAuraAnimations=new Map();
function drawMiniAura(canvas,c1Hex,c2Hex){
  const ctx=canvas.getContext('2d');
  const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2;
  const rgb1=hexToRgb(c1Hex),rgb2=hexToRgb(c2Hex);
  let phase=Math.random()*Math.PI*2;
  function frame(){
    phase+=0.03;
    ctx.clearRect(0,0,w,h);
    // Outer glow
    const g1=ctx.createRadialGradient(cx,cy,0,cx,cy,w*.48);
    g1.addColorStop(0,'rgba('+rgb1+',0.5)');
    g1.addColorStop(0.4,'rgba('+rgb2+',0.3)');
    g1.addColorStop(1,'rgba('+rgb2+',0)');
    ctx.fillStyle=g1;ctx.fillRect(0,0,w,h);
    // Inner breathing orb
    const breathe=0.25+Math.sin(phase)*0.06;
    const r=w*breathe;
    const g2=ctx.createRadialGradient(cx+Math.sin(phase*0.7)*3,cy+Math.cos(phase*0.9)*3,0,cx,cy,r);
    g2.addColorStop(0,'rgba('+rgb1+',0.8)');
    g2.addColorStop(0.6,'rgba('+rgb2+',0.4)');
    g2.addColorStop(1,'rgba('+rgb2+',0)');
    ctx.fillStyle=g2;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    // Shimmer highlight
    const shimX=cx+Math.sin(phase*1.3)*6,shimY=cy+Math.cos(phase*1.1)*6;
    const g3=ctx.createRadialGradient(shimX,shimY,0,shimX,shimY,r*0.5);
    g3.addColorStop(0,'rgba(255,255,255,0.15)');
    g3.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g3;
    ctx.beginPath();ctx.arc(shimX,shimY,r*0.5,0,Math.PI*2);ctx.fill();
    const animId=requestAnimationFrame(frame);
    miniAuraAnimations.set(canvas,animId);
  }
  // Cancel previous animation if any
  if(miniAuraAnimations.has(canvas))cancelAnimationFrame(miniAuraAnimations.get(canvas));
  frame();
}

async function deleteAgent(id){

        if(!activeAgentId&&j.agent)setActiveAgent(j.agent.id);else if(isEdit&&ag.id===activeAgentId)setActiveAgent(ag.id)}
      else toast('Failed','error')}catch(e){toast('Error','error')}};

function parseCurl(curl){let method='GET',url='',headers={},body=null;
  curl=curl.replace(/\\\n/g,' ').trim();if(curl.startsWith('curl '))curl=curl.slice(5);
  let mm=curl.match(/-X\s+(\w+)/);if(mm){method=mm[1].toUpperCase();curl=curl.replace(mm[0],'')}
  const hr=/-H\s+['"](.*?)['"]/g;let hm;while((hm=hr.exec(curl))!==null){
    const parts=hm[1].split(':');headers[parts[0].trim()]=parts.slice(1).join(':').trim();curl=curl.replace(hm[0],'')}
  const dm=curl.match(/(?:-d|--data|--data-raw|--data-binary)\s+['"]?([\s\S]*?)['"]?\s*(?=-|$)/);
  if(dm){const raw=dm[1].replace(/^['"]|['"]$/g,'');try{body=JSON.parse(raw)}catch(e){body=raw}
    if(!mm)method='POST';curl=curl.replace(dm[0],'')}
  const um=curl.match(/(https?:\/\/[^\s'"]+)/);if(um)url=um[1].replace(/['"]/g,'');
  if(!url)throw new Error('No URL found');const fields=[];
  if(body&&typeof body==='object')for(const bk in body){
    const bv=body[bk];let t='string';if(typeof bv==='number')t=Number.isInteger(bv)?'integer':'number';
    else if(typeof bv==='boolean')t='boolean';fields.push({name:bk,type:t})}
  try{const u=new URL(url);for(const pair of u.searchParams)fields.push({name:pair[0],type:'string'})}catch(e){}
  return{method,url,headers,body,fields}}

function folderQuestSummary(path){

  return{state,label,quests,done,total:docs.length,ready,pending,generating,failed}

function buildDocTreeFromList(docs){
  const root={name:'Documents',path:'',type:'root',children:[],files:[]};
  docs.forEach(doc=>{
    const path=normDocPath(doc.relative_path||doc.filename||'document');const parts=path.split('/').filter(Boolean);let node=root;
    parts.forEach((part,index)=>{
      if(index===parts.length-1)node.files.push(doc);
      else{let child=node.children.find(c=>c.name===part);if(!child){child={name:part,path:parts.slice(0,index+1).join('/'),type:'folder',children:[],files:[]};node.children.push(child)}node=child}
    });
  });
  const sortNode=node=>{node.children.sort((a,b)=>a.name.localeCompare(b.name));node.files.sort((a,b)=>(a.relative_path||a.filename||'').localeCompare(b.relative_path||b.filename||''));node.children.forEach(sortNode)};
  sortNode(root);return root;
}

/* ── Upload Queue (parallel uploads, progress per folder) ───── */
const UploadQueue={
  _pending:[],_active:[],_done:[],MAX_CONCURRENT:3,BATCH_SIZE:500,_seq:0,
  _uid(){return ++this._seq},
  add(files){
    const arr=Array.from(files||[]);if(!arr.length)return;
    const name=(arr[0].webkitRelativePath||arr[0].name).split('/')[0]||'Upload';
    const batches=[];
    for(let i=0;i<arr.length;i+=this.BATCH_SIZE)batches.push(arr.slice(i,i+this.BATCH_SIZE));
    batches.forEach((batch,bi)=>{
      const bname=batches.length>1?name+' ('+(bi+1)+'/'+batches.length+')':name;
      this._pending.push({id:this._uid(),name:bname,files:batch,status:'pending',progress:0,error:null,jobId:null});
    });
    this._flush();this._render();
  },
  _flush(){
    while(this._active.length<this.MAX_CONCURRENT&&this._pending.length){
      const item=this._pending.shift();this._active.push(item);this._run(item);
    }
  },
  async _run(item){
    item.status='uploading';item.progress=0;this._render();
    try{
      const paths=item.files.map(f=>f.webkitRelativePath||f.name);
      const fd=new FormData();item.files.forEach(f=>fd.append('files',f));
      fd.append('paths',JSON.stringify(paths));fd.append('collection_name',item.name);
      const r=await fetch(API+'/api/documents/ingest',{method:'POST',body:fd,headers:ModelConfig.headers()});
      const j=await r.json();
      if(!r.ok){item.status='error';item.error=j.detail||'Upload failed';}
      else{item.status='processing';item.jobId=j.job_id;this._poll(item);return;}
    }catch(e){item.status='error';item.error=e.message||'Upload failed';}
    this._done.unshift(item);this._active=this._active.filter(x=>x!==item);
    this._flush();this._render();
  },
  async _poll(item){
    for(let i=0;i<300;i++){
      await new Promise(r=>setTimeout(r,2000));
      try{
        const r=await fetch(API+'/api/documents/jobs/'+item.jobId);
        const j=await r.json();const job=j.job||{};
        const tot=Math.max(1,job.total_files||1);
        if(job.status==='generating_quests')
          item.progress=50+Math.round(((job.quest_processed_files||0)/Math.max(1,job.quest_total_files||1))*50);
        else item.progress=Math.round(((job.processed_files||0)/tot)*50);
        this._render();
        if(['done','done_with_errors','failed'].includes(job.status)){
          item.status=job.status==='done'?'done':'done_with_errors';
          item.progress=100;
          toast(job.status==='done'?'✓ '+item.name+' ready':item.name+' finished with errors',job.status==='done'?'success':'error');
          await refreshDocs();
          this._done.unshift(item);this._active=this._active.filter(x=>x!==item);
          this._flush();this._render();return;
        }
      }catch(e){}
    }
    item.status='error';item.error='Timed out';
    this._done.unshift(item);this._active=this._active.filter(x=>x!==item);
    this._flush();this._render();
  },
  retry(id){
    const item=[...this._done,...this._active].find(x=>x.id===id);if(!item)return;
    item.status='pending';item.progress=0;item.error=null;item.jobId=null;
    this._done=this._done.filter(x=>x.id!==id);
    this._active=this._active.filter(x=>x.id!==id);
    this._pending.unshift(item);this._flush();this._render();
  },
  _render(){
    const el=document.getElementById('uploadQueueEl');if(!el)return;
    const all=[...this._active,...this._pending,...this._done.slice(0,6)];
    if(!all.length){el.innerHTML='';return;}
    const IC={pending:'·',uploading:'↑',processing:'⟳',done:'✓',done_with_errors:'⚠',error:'✕'};
    const CL={pending:'uq-wait',uploading:'uq-run',processing:'uq-run',done:'uq-ok',done_with_errors:'uq-warn',error:'uq-err'};
    el.innerHTML=all.map(item=>{
      const showBar=item.status==='uploading'||item.status==='processing';
      const pct=item.status==='done'||item.status==='done_with_errors'?100:item.progress;
      return '<div class="uq-item '+(CL[item.status]||'')+'">'
        +'<span class="uq-icon">'+(IC[item.status]||'·')+'</span>'
        +'<span class="uq-name">'+escapeHtml(item.name)+'</span>'
        +'<span class="uq-count">'+item.files.length+' file'+(item.files.length===1?'':'s')+'</span>'
        +(showBar?'<div class="uq-bar"><div class="uq-bar-fill" style="width:'+pct+'%"></div></div><span class="uq-pct">'+pct+'%</span>':'')
        +(item.error?'<span class="uq-errtxt">'+escapeHtml(item.error)+'</span>':'')
        +((item.status==='error'||item.status==='done_with_errors')?'<button class="uq-retry-btn" onclick="UploadQueue.retry('+item.id+')">↺ retry</button>':'')
        +'</div>';
    }).join('');
  }
};

async function retryKQuest(path){

  try{

    const j=await r.json();

  }catch(e){toast('Retry failed','error');}
}

  STORE:'va.modelSettings',
  defaults:{provider:'local',api_key:'',llm_model:'',stt_model:'',tts_model:'',reasoning_effort:'low',
    use_llm:true,use_stt:true,use_tts:true,live_captions:false},
  server:null,keyOk:null,testedKey:null,state:null,
  get(){if(!this.state){let s={};try{s=JSON.parse(localStorage.getItem(this.STORE)||'{}')}catch(e){}
    this.state=Object.assign({},this.defaults,s)}return this.state},
  save(s){this.state=Object.assign({},this.defaults,s);
    try{localStorage.setItem(this.STORE,JSON.stringify(this.state))}catch(e){}this.render()},
  geminiOnly(){return !!(this.server&&this.server.mode==='gemini')},
  isGemini(){return this.geminiOnly()||this.get().provider==='gemini'},
  missingKey(){return this.isGemini()&&!this.get().api_key&&!(this.server&&this.server.server_key)},
  payload(){return this.isGemini()?Object.assign({},this.get(),{provider:'gemini'}):{provider:'local'}},
  headers(){return this.isGemini()?{'X-Model-Settings':JSON.stringify(this.payload())}:{}},
  render(){const g=this.isGemini();
    document.getElementById('modelLabel').textContent=g?'Gemini':'Local';
    document.getElementById('svcGeminiWrap').style.display=g?'':'none';
    document.getElementById('svcGemini').className='d'+(this.keyOk===true?' on':this.keyOk===false?' off':'')},
  async loadDefaults(){try{const r=await fetch(API+'/api/model/defaults');this.server=await r.json()}catch(e){this.server=null}
    this.render();
    if(this.missingKey())setTimeout(()=>{toast('This server runs on Gemini: add your API key to start','info');openModelModal()},400)},
  CATALOG:'va.modelCatalog',catalog:null,
  _fp(k){return k?k.slice(0,6)+':'+k.slice(-4)+':'+k.length:'server'},
  catalogFor(apiKey){if(!this.catalog){try{this.catalog=JSON.parse(localStorage.getItem(this.CATALOG)||'null')}catch(e){}}
    return this.catalog&&this.catalog.fp===this._fp(apiKey)?this.catalog.models:null},
  async fetchCatalog(apiKey){const j=await this.test(apiKey);
    if(j.ok){this.catalog={fp:this._fp(apiKey),models:j.models,at:Date.now()};
      try{localStorage.setItem(this.CATALOG,JSON.stringify(this.catalog))}catch(e){}}
    return j},
  async test(apiKey){
    const r=await fetch(API+'/api/model/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:apiKey})});
    const j=await r.json();this.testedKey=apiKey;this.keyOk=!!j.ok;this.render();return j},
};

    +(d.server_key?' Leave empty to use the key configured on the server.':'')+'</div></div>'
    +'<div class="mf" id="mdlStages"><label>Use Gemini for</label><div class="model-stage-row">'

    +'<div class="mf"><label>Speech-to-text model</label><select id="mdlStt"></select><div class="hint" id="mdlSttHint"></div></div>'
    +'<div class="mf"><label>Chat model (LLM)</label><select id="mdlLlm"></select><div class="hint" id="mdlLlmHint"></div></div>'
    +'<div class="mf"><label>Text-to-speech model</label><select id="mdlTts"></select><div class="hint" id="mdlTtsHint"></div></div>'
    +'<div class="mf" style="margin-top:-8px"><div class="hint" id="mdlModelsNote"></div></div>'
    +'<div class="mf"><label>Reasoning effort</label><select id="mdlEffort">'
    +'<option value="low">Low (fastest on Gemini 3)</option><option value="medium">Medium</option><option value="high">High</option>'
    +'<option value="none">None (Gemini 2.5 Flash only)</option><option value="">Model default</option></select>'

  document.body.appendChild(ov);

  const setProvider=p=>{provider=p;ov.querySelectorAll('#mdlProvider button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));

  ov.querySelectorAll('#mdlProvider button').forEach(b=>b.onclick=()=>setProvider(b.dataset.p));
  setProvider(provider);
  $('mdlKey').value=cur.api_key||'';
  $('mdlUseStt').checked=!!cur.use_stt;$('mdlUseLlm').checked=!!cur.use_llm;$('mdlUseTts').checked=!!cur.use_tts;
  const picked={llm:cur.llm_model||'',stt:cur.stt_model||'',tts:cur.tts_model||''};
  const defaults={llm:d.llm_model||'gemini-3.8-flash',stt:d.stt_model||'gemini-3.5-flash-lite',tts:d.tts_model||'gemini-3.8-flash-tts'};
  const SEL={llm:'mdlLlm',stt:'mdlStt',tts:'mdlTts'};
  const describe=(stage,list)=>{const id=picked[stage]||defaults[stage];const m=(list||[]).find(x=>x.id===id);
    $(SEL[stage]+'Hint').textContent=m&&m.description?m.description:''};
  const renderModels=(models,loading)=>{
    Object.keys(SEL).forEach(stage=>{const sel=$(SEL[stage]),list=models&&models[stage];sel.innerHTML='';
      const add=(value,text,title)=>{const o=document.createElement('option');o.value=value;o.textContent=text;if(title)o.title=title;sel.appendChild(o)};
      add('','Default: '+defaults[stage]);
      if(loading)add('__loading','Loading models from your key…');

      (list||[]).forEach(m=>{ids.add(m.id);add(m.id,m.label&&m.label!==m.id?m.label+'  ·  '+m.id:m.id,m.description)});
      if(picked[stage]&&!ids.has(picked[stage]))add(picked[stage],picked[stage]+(list?'  (not listed for this key)':''));
      sel.value=picked[stage];describe(stage,list);
      sel.onchange=()=>{if(sel.value==='__loading')sel.value=picked[stage];picked[stage]=sel.value;describe(stage,list)}});
    const n=models?Object.fromEntries(Object.keys(SEL).map(k=>[k,(models[k]||[]).length])):null;

    renderModels(cached,true);
    try{const j=await ModelConfig.fetchCatalog(key);
      if(!ov.isConnected)return;
      if(j.ok){renderModels(j.models,false);loadedFp=ModelConfig._fp(key);
        status('Key works.','ok')}
      else{renderModels(null,false);status(j.error||'Key check failed','err')}}

  ov.querySelectorAll('#mdlProvider button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.p==='gemini'&&!loadedFp)loadModels(false)}));
  if(provider==='gemini')loadModels(false);else renderModels(ModelConfig.catalogFor(cur.api_key||''),false);
  const close=()=>ov.remove();
  $('mdlCancel').onclick=close;ov.onclick=e=>{if(e.target===ov)close()};
  $('mdlSave').onclick=()=>{
    const next={provider,api_key:$('mdlKey').value.trim(),llm_model:picked.llm,stt_model:picked.stt,
      tts_model:picked.tts,reasoning_effort:$('mdlEffort').value,use_llm:$('mdlUseLlm').checked,
      use_stt:$('mdlUseStt').checked,use_tts:$('mdlUseTts').checked,live_captions:$('mdlCaptions').checked};
    if(next.api_key!==ModelConfig.testedKey)ModelConfig.keyOk=null;
    ModelConfig.save(next);
    if(ModelConfig.missingKey()){status('Add an API key to use Gemini','err');return}
    const ws=voiceAgent&&voiceAgent.ws;
    if(ws&&ws.readyState===1&&voiceAgent.state!=='idle')ws.send(JSON.stringify({action:'set_model',model:ModelConfig.payload()}));
    toast(provider==='gemini'?'Using Gemini for the next turn':'Using the local GPU stack','success');close()};
}

const GuidedTour={
  index:0,root:null,openedModal:null,startView:'sandbox',startTab:'agents',_resize:null,_keydown:null,
  start(){
    this.root=document.getElementById('tourRoot');
    this.index=0;this.openedModal=null;
    const activeView=document.querySelector('.nav-tab.active');
    const activeTab=document.querySelector('.agents-subtab.active');
    this.startView=activeView?.dataset.view||'sandbox';this.startTab=activeTab?.dataset.atab||'agents';
    this.root.hidden=false;
    this._resize=()=>this.position();this._keydown=e=>{
      if(e.key==='Escape')this.end(true);
      else if(e.key==='ArrowRight')this.next();
      else if(e.key==='ArrowLeft')this.prev();
    };
    window.addEventListener('resize',this._resize);document.addEventListener('keydown',this._keydown);
    document.getElementById('tourSkip').onclick=()=>this.end(true);
    document.getElementById('tourPrev').onclick=()=>this.prev();
    document.getElementById('tourNext').onclick=()=>this.next();
    this.show(0);
  },
  show(i){
    if(i<0||i>=TOUR_STEPS.length){this.end(false);return}
    this.index=i;
    const step=TOUR_STEPS[i];
    if(step.view)switchView(step.view);
    if(step.tab)switchAgentsTab(step.tab);
    if(step.before)step.before();
    setTimeout(()=>this.position(),90);
  },
  next(){this.show(this.index+1)},
  prev(){this.show(this.index-1)},
  targetFor(step){
    const selectors=Array.isArray(step.selector)?step.selector:[step.selector];
    for(const sel of selectors){
      const el=document.querySelector(sel);
      if(!el)continue;
      const st=getComputedStyle(el),r=el.getBoundingClientRect();
      if(st.display!=='none'&&st.visibility!=='hidden'&&r.width>0&&r.height>0)return el;
    }
    return document.querySelector('.app');
  },
  position(){
    if(!this.root||this.root.hidden)return;
    const step=TOUR_STEPS[this.index],target=this.targetFor(step);
    if(target?.scrollIntoView)target.scrollIntoView({block:'center',inline:'center',behavior:'smooth'});
    requestAnimationFrame(()=>{
      const rect=(target||document.body).getBoundingClientRect();
      const pad=8;
      const left=Math.max(8,rect.left-pad),top=Math.max(8,rect.top-pad);
      const right=Math.min(window.innerWidth-8,rect.right+pad),bottom=Math.min(window.innerHeight-8,rect.bottom+pad);
      const w=Math.max(24,right-left),h=Math.max(24,bottom-top);
      this.setBox('tourScrimTop',0,0,window.innerWidth,top);
      this.setBox('tourScrimRight',right,top,window.innerWidth-right,h);
      this.setBox('tourScrimBottom',0,bottom,window.innerWidth,window.innerHeight-bottom);
      this.setBox('tourScrimLeft',0,top,left,h);
      this.setBox('tourFocus',left,top,w,h);
      const focus=document.getElementById('tourFocus');
      const radius=getComputedStyle(target).borderRadius||'14px';focus.style.borderRadius=radius;
      document.getElementById('tourTitle').textContent=step.title;
      document.getElementById('tourText').textContent=step.text;
      document.getElementById('tourKicker').textContent='Step '+(this.index+1)+' of '+TOUR_STEPS.length;
      document.getElementById('tourCount').textContent=(this.index+1)+'/'+TOUR_STEPS.length;
      document.getElementById('tourProgress').style.width=((this.index+1)/TOUR_STEPS.length*100)+'%';
      document.getElementById('tourPrev').disabled=this.index===0;
      document.getElementById('tourNext').textContent=this.index===TOUR_STEPS.length-1?'Done':'Next';
      this.placeCard(left,top,w,h);
    });
  },
  setBox(id,left,top,width,height){
    const el=document.getElementById(id);
    el.style.left=left+'px';el.style.top=top+'px';el.style.width=Math.max(0,width)+'px';el.style.height=Math.max(0,height)+'px';
  },
  placeCard(left,top,w,h){
    const card=document.getElementById('tourCard');
    card.classList.remove('above');
    const cw=card.offsetWidth,ch=card.offsetHeight,gap=14;
    let x=left+w+gap,y=top;
    if(x+cw>window.innerWidth-16)x=left-cw-gap;
    if(x<16)x=Math.min(Math.max(16,left),window.innerWidth-cw-16);
    if(y+ch>window.innerHeight-16){y=top-ch-gap;card.classList.add('above')}
    if(y<16){y=Math.min(window.innerHeight-ch-16,top+h+gap);card.classList.remove('above')}
    card.style.left=Math.max(16,Math.min(window.innerWidth-cw-16,x))+'px';
    card.style.top=Math.max(16,Math.min(window.innerHeight-ch-16,y))+'px';
  },
  openAgentEditor(){
    switchView('agents');switchAgentsTab('agents');
    let modal=document.querySelector('.modal-overlay');
    if(!modal){openAgentModal(activeAgentId||allAgents[0]?.id);modal=document.querySelector('.modal-overlay');this.openedModal=modal}
  },
  closeTourModal(){if(this.openedModal&&document.body.contains(this.openedModal)){this.openedModal.remove()}this.openedModal=null},
  end(){
    this.closeTourModal();
    if(this.root)this.root.hidden=true;
    window.removeEventListener('resize',this._resize);document.removeEventListener('keydown',this._keydown);
    switchView(this.startView);if(this.startView==='agents')switchAgentsTab(this.startTab);
  }
};

uzAV.ondragover=e=>{e.preventDefault();uzAV.classList.add('drag')};uzAV.ondragleave=()=>uzAV.classList.remove('drag');
uzAV.ondrop=async e=>{
  e.preventDefault();uzAV.classList.remove('drag');
  const items=[...(e.dataTransfer.items||[])].filter(i=>i.kind==='file');
  const dirs=items.filter(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()?.isDirectory);
  if(dirs.length){
    for(const item of dirs){
      const entry=item.webkitGetAsEntry();
      const{files,paths}=await _readDirEntry(entry,'');
      if(files.length){
        // Build a FileList-like array with webkitRelativePath info stored as _path
        files.forEach((f,i)=>Object.defineProperty(f,'webkitRelativePath',{get:()=>paths[i],configurable:true}));
        UploadQueue.add(files);
      }
    }
    const plain=items.filter(i=>!(i.webkitGetAsEntry&&i.webkitGetAsEntry()?.isDirectory));
    if(plain.length)UploadQueue.add(plain.map(i=>i.getAsFile()).filter(Boolean));
  }else{
    UploadQueue.add(e.dataTransfer.files);
  }
};
async function _readDirEntry(entry,base){
  const files=[],paths=[];
  await new Promise(resolve=>{
    const r=entry.createReader();
    function read(){r.readEntries(async entries=>{
      if(!entries.length){resolve();return}
      for(const e of entries){
        if(e.isFile)await new Promise(r2=>e.file(f=>{files.push(f);paths.push(base?base+'/'+f.name:f.name);r2()},r2));
        else{const sub=await _readDirEntry(e,base?base+'/'+e.name:e.name);files.push(...sub.files);paths.push(...sub.paths);}
      }
      read();
    });}
    read();
  });
  return{files,paths};
}
document.getElementById('btnAddAgent').onclick=()=>openAgentModal();
document.getElementById('btnModel').onclick=()=>openModelModal();
ModelConfig.render();ModelConfig.loadDefaults();
refreshDocs();refreshApis();loadAgents();checkServices();
setInterval(checkServices,15000);setInterval(refreshDocs,30000);
</script>
